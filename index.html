<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ar">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Google</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Plus+Jakarta+Sans:400,500,600,700"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"/>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script async src="https://www.instagram.com/embed.js"></script>
<style>
/* ═══════════════════════════════════════════
   DEEP OCEAN THEME TOKENS
═══════════════════════════════════════════ */
:root {
  /* Deep Ocean Palette */
  --do-bg-base:      #040d21;   /* قاع المحيط */
  --do-bg-surface:   #071428;   /* سطح المحيط */
  --do-bg-card:      #0a1a33;   /* بطاقة */
  --do-bg-input:     #0c1f3a;   /* حقل إدخال */
  --do-bg-hover:     #0e2444;   /* hover */
  --do-bg-elevated:  #102850;   /* مرتفع */

  --do-border:       rgba(0,168,255,.12);
  --do-border-focus: rgba(0,200,255,.4);

  --do-accent:       #00c8ff;   /* أزرق مضيء */
  --do-accent-dim:   rgba(0,200,255,.1);
  --do-accent-glow:  rgba(0,200,255,.2);
  --do-green:        #00e5a0;   /* أخضر بحري */
  --do-green-dim:    rgba(0,229,160,.1);
  --do-purple:       #7c4dff;   /* بنفسجي عميق */
  --do-amber:        #ffab40;

  --do-text-primary:  #d0e8ff;
  --do-text-secondary:#6b8aad;
  --do-text-muted:    #2e4a6a;
  --do-text-name:     #80d4ff;

  /* shimmer animation */
  --shimmer: linear-gradient(90deg, var(--do-accent) 0%, var(--do-green) 50%, var(--do-accent) 100%);
}

/* ═══════════════════════════════════════════
   BASE RESET
═══════════════════════════════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
body{
  color:#6c8099;
  font-family:'Plus Jakarta Sans','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  font-size:13px;
  background:var(--do-bg-base);
  overscroll-behavior:none
}
div{margin:0;padding:0}
img{border:none}
textarea,input{font-family:inherit}
a{color:var(--do-accent);text-decoration:none}
a:hover{text-decoration:underline}
.noselect{-webkit-user-select:none;user-select:none}
.valign{display:table;width:100%}
.valign-in1{display:table-cell;vertical-align:middle;text-align:center}
.valign-in2{display:block}

/* ═══════════════════════════════════════════
   LAYOUT STRUCTURE
═══════════════════════════════════════════ */
.group-chat-embedded{position:absolute;inset:0;width:100%;height:100%;background:var(--do-bg-base)}
.chat-wrapper{position:absolute;left:0;width:100%;top:0;bottom:36px;font-size:14px;line-height:normal;background:var(--do-bg-base)}
.chat-top{
  position:absolute;top:0;left:0;right:0;height:36px;
  background:var(--do-bg-surface);
  border-bottom:1px solid var(--do-border);
  z-index:5
}
.chat-name{
  position:absolute;top:8px;left:10px;right:10px;height:27px;
  color:var(--do-text-primary);font-size:17px;font-weight:600;
  white-space:nowrap;overflow:hidden
}

/* ═══════════════════════════════════════════
   MESSAGES CONTAINER
═══════════════════════════════════════════ */
.chat-messages-container{
  position:absolute;
  top:36px;left:5px;right:132px;bottom:68px;
  overflow-y:scroll;overflow-x:hidden;
  background:var(--do-bg-base);
  scrollbar-width:thin;
  scrollbar-color:rgba(0,168,255,.2) rgba(0,168,255,.04)
}
.chat-messages-container::-webkit-scrollbar{width:6px;background:rgba(0,168,255,.04)}
.chat-messages-container::-webkit-scrollbar-thumb{
  border-radius:6px;
  background:rgba(0,168,255,.2)
}
.chat-messages-container::-webkit-scrollbar-thumb:hover{background:rgba(0,168,255,.35)}
.chat-messages{padding-bottom:2px}

/* ═══════════════════════════════════════════
   NEWS CONTAINER — مستقلة عن حاوية الرسائل
═══════════════════════════════════════════ */
.news-container{
  position:absolute;
  top:36px;left:5px;right:5px;bottom:68px;
  overflow-y:auto;overflow-x:hidden;
  background:var(--do-bg-base);
  display:none;
  scrollbar-width:thin;
  scrollbar-color:rgba(0,168,255,.2) transparent
}
.news-container::-webkit-scrollbar{width:5px}
.news-container::-webkit-scrollbar-thumb{border-radius:5px;background:rgba(0,168,255,.2)}

body.chat-locked  .news-container{display:block !important}
body.chat-unlocked .news-container{display:none !important}
body.chat-locked  .chat-messages-container{display:none !important}

/* ═══════════════════════════════════════════
   CONTACTS / PRESENCE SIDEBAR
═══════════════════════════════════════════ */
.chat-contacts-container{
  position:absolute;right:5px;width:125px;top:36px;bottom:92px;
  overflow-x:hidden;overflow-y:auto;
  background:var(--do-bg-base)
}
.chat-contacts{padding:6px}
.chat-contacts-divider{
  position:absolute;top:36px;bottom:68px;right:130px;width:1px;
  background:var(--do-border)
}
.chat-contacts-banner{
  position:absolute;bottom:68px;height:24px;right:5px;width:125px;
  background:var(--do-bg-surface);
  border-top:1px solid var(--do-border)
}
.chat-online-count{position:absolute;top:6px;left:8px;font-size:11px;font-weight:700;color:var(--do-green)}

/* ═══════════════════════════════════════════
   INPUT AREA — Fixed, no resize
═══════════════════════════════════════════ */
.chat-input-container{
  position:absolute;bottom:0;height:68px;left:0;right:0;
  background:var(--do-bg-surface);
  border-top:1px solid var(--do-border);
  z-index:30;
  overflow:hidden
}
.chat-input-wrapper{
  position:absolute;
  top:10px;bottom:10px;left:10px;right:10px;
  height:48px;
  overflow:hidden
}
.chat-input,.chat-textarea{
  position:absolute;border-radius:10px;top:0;left:0;
  width:100%;height:100%;
  border:1px solid var(--do-border);
  margin:0;padding:8px 14px;
  overflow-y:auto;overflow-x:hidden;
  font-size:15px;
  background:var(--do-bg-input);
  color:var(--do-text-primary);
  resize:none;outline:none;line-height:1.4;
  box-sizing:border-box;
  transition:border-color .18s ease;
  /* FIXED — ثابت تماماً */
  min-height:unset;
  max-height:unset
}
.chat-input:focus,.chat-textarea:focus{
  border-color:var(--do-border-focus);
  box-shadow:0 0 0 2px var(--do-accent-dim)
}
.chat-input::placeholder,.chat-textarea::placeholder{color:var(--do-text-muted)}

/* sign-in overlay */
.chat-signin-box{position:absolute;left:5px;right:5px;top:0;bottom:5px;background:var(--do-bg-base)}
.signin-box{position:absolute;top:0;left:0;width:100%;height:100%;text-align:center}
.signin-title{display:block;padding:5px 0 6px;font-size:11px;color:var(--do-text-primary);font-weight:700}
.signin-input{
  font-size:1.1em;padding:4px 8px;vertical-align:middle;
  width:35%;max-width:150px;
  background:var(--do-bg-input);
  color:var(--do-text-primary);
  border:1px solid var(--do-border);
  border-radius:6px
}
.signin-input:focus{outline:none;border-color:var(--do-border-focus)}
.consent-accept{
  background:var(--do-accent);color:#040d21;margin:0;vertical-align:middle;
  border:none;border-radius:6px;padding:5px 10px;cursor:pointer;
  font-size:13px;font-weight:700;line-height:1.5;
  transition:opacity .15s
}
.consent-accept:hover{opacity:.85}
.consent-accept:disabled{opacity:.5;cursor:not-allowed}

.chat-welcome-message{padding:10px;color:var(--do-bg-base);font-size:0}
.chat-history-controls{padding:8px 0 6px;text-align:center}
.chat-create-link{display:none!important}
.send-btn,.attach-bar,.sidebar-toggle,.sidebar-backdrop{display:none!important}
#fileInput{display:none!important}

/* ═══════════════════════════════════════════
   MESSAGES
═══════════════════════════════════════════ */
.msg.message{
  position:relative;display:block;
  padding:2px 2px 6px;
  color:var(--do-text-secondary);
  line-height:1.4em;min-height:44px;
  border-radius:6px;
  transition:background .15s
}
.msg.message:hover{background:rgba(0,168,255,.04)}
.msg-avatar{
  position:absolute;top:4px;left:8px;cursor:pointer;
  width:38px;height:38px;border-radius:50%;
  background-size:cover;background-position:center;
  border:1px solid var(--do-border)
}
.msg-body{
  position:relative;min-width:0;
  padding-left:50px;padding-right:4px;padding-top:6px;
  min-height:35px;max-width:100%;box-sizing:border-box;overflow:hidden
}
.msg-date-line{padding-bottom:2px;font-size:11px;line-height:1em;color:var(--do-text-muted)}
.msg-content-line{
  font-size:14px;color:var(--do-text-primary);line-height:1.4em;
  word-break:break-word;overflow-wrap:anywhere;unicode-bidi:plaintext
}
.msg-inline-name{font-weight:700;cursor:pointer;color:var(--do-text-name)}
.msg-inline-type{font-size:.77em;color:var(--do-text-secondary);font-weight:400}
.msg-colon{color:var(--do-text-secondary);margin:0}
.msg-text{
  font-size:14px;color:var(--do-text-primary);line-height:1.4em;display:inline;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  font-variant-numeric:normal
}
.msg-text a{color:var(--do-accent)}
.emoji-char{
  font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji','Twemoji Mozilla',sans-serif!important;
  font-style:normal;display:inline
}
.msg-edited{font-size:10px;color:var(--do-text-muted);margin-left:4px;font-style:italic}
.msg-media-wrap{display:block;margin-top:6px;max-width:100%;overflow:hidden}
.msg-image{max-width:min(100%,520px);max-height:70vh;object-fit:contain;cursor:zoom-in;border:none;border-radius:6px}
.msg-file-link{
  display:inline-flex;max-width:min(100%,520px);
  background:var(--do-bg-card);border-radius:6px;padding:6px 8px;
  color:var(--do-text-secondary);font-size:12px;text-decoration:none;
  border:1px solid var(--do-border);
  transition:border-color .15s
}
.msg-file-link:hover{border-color:var(--do-border-focus);text-decoration:none}
.msg-file-icon{margin-left:6px}
.msg-file-info{display:flex;flex-direction:column;min-width:0}
.msg-file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--do-text-primary);font-size:12px}
.msg-file-size{font-size:10px;color:var(--do-text-muted)}
.msg-file-hint{font-size:10px;color:var(--do-accent);margin-top:2px}
.msg.selected-message{background:rgba(0,200,255,.1)!important;outline:1px solid rgba(0,200,255,.4)}
.msg.reply-highlight{background:rgba(0,229,160,.08)!important}

/* ═══════════════════════════════════════════
   PRESENCE
═══════════════════════════════════════════ */
.contact-list-item{position:relative;width:100%;height:24px}
.contact-list-profile-image,.presence-avatar{
  position:absolute;top:0;left:0;cursor:pointer;
  width:20px;height:20px;border-radius:50%;
  background-size:cover;background-position:center;
  border:1px solid var(--do-border)
}
.contact-list-profile-name,.presence-name{
  padding:2px 0 0 26px;font-size:12px;white-space:nowrap;
  overflow:hidden;cursor:pointer;color:var(--do-text-primary);font-weight:500
}
.contact-list-status-icon,.presence-dot{
  position:absolute;top:8px;right:2px;
  width:6px;height:6px;border-radius:50%;background:var(--do-green)
}
.presence-name.viewer-count{color:var(--do-green);font-weight:700}

/* ═══════════════════════════════════════════
   FOOTER ACTION BUTTONS — Deep Ocean style
═══════════════════════════════════════════ */
.chat-footer-attach-button,
.chat-footer-gif-button,
.chat-footer-mic-button,
.chat-footer-logout-button,
.chat-footer-clear-button,
.chat-footer-emoji-button{
  display:none!important;
  position:absolute!important;bottom:8px!important;
  align-items:center;justify-content:center;
  color:var(--do-text-secondary)!important;cursor:pointer;
  z-index:60!important;text-decoration:none!important;
  transition:all .18s ease!important
}
.chat-footer-attach-button,.chat-footer-mic-button,
.chat-footer-logout-button,.chat-footer-emoji-button{width:20px!important;height:20px!important}

.chat-footer-attach-button svg,
.chat-footer-logout-button svg,
.chat-footer-mic-button svg,
.chat-footer-clear-button svg{
  width:14px!important;height:14px!important;
  stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;display:block
}
.chat-footer-emoji-button{
  right:184px!important;font-size:16px!important;
  width:22px!important;height:20px!important;
  border:1px solid var(--do-border)!important;border-radius:5px!important;
  background:var(--do-bg-card)!important;display:none!important
}
.chat-footer-attach-button{right:154px!important}
.chat-footer-gif-button{
  right:118px!important;width:24px!important;height:20px!important;
  font-size:10px!important;font-weight:700!important;
  border:1px solid var(--do-border)!important;border-radius:5px!important;
  background:var(--do-bg-card)!important;letter-spacing:.2px!important;
  line-height:20px;text-align:center;color:var(--do-accent)!important
}
.chat-footer-mic-button{
  right:82px!important;
  border:1px solid var(--do-border)!important;border-radius:5px!important;
  background:var(--do-bg-card)!important;width:22px!important
}
.chat-footer-logout-button{right:15px!important}
.chat-footer-clear-button{
  right:48px!important;width:22px!important;height:20px!important;
  border:1px solid var(--do-border)!important;border-radius:5px!important;
  background:var(--do-bg-card)!important;color:#f87171!important
}
.chat-footer-attach-button:hover,
.chat-footer-gif-button:hover,
.chat-footer-mic-button:hover,
.chat-footer-logout-button:hover,
.chat-footer-emoji-button:hover{
  color:var(--do-accent)!important;
  border-color:var(--do-border-focus)!important;
  background:var(--do-bg-hover)!important
}
.chat-footer-clear-button:hover{border-color:rgba(248,113,113,.4)!important;background:rgba(248,113,113,.08)!important}
.chat-footer-mic-button.recording{
  color:#f87171!important;border-color:#f87171!important;
  background:rgba(248,113,113,.1)!important;animation:voicePulse 1s infinite alternate
}
@keyframes voicePulse{from{opacity:.75}to{opacity:1}}

body.chat-unlocked .chat-footer-emoji-button{display:flex!important}
body.chat-unlocked .chat-footer-attach-button{display:flex!important}
body.chat-unlocked .chat-footer-gif-button{display:block!important}
body.chat-unlocked .chat-footer-mic-button{display:flex!important}
body.chat-unlocked .chat-footer-logout-button{display:flex!important}
body.chat-unlocked .chat-footer-clear-button.show{display:flex!important}

/* ═══════════════════════════════════════════
   LOCKED STATE
═══════════════════════════════════════════ */
body.chat-locked .chat-contacts-container,
body.chat-locked .chat-contacts-divider,
body.chat-locked .chat-contacts-banner{display:none!important}

/* ═══════════════════════════════════════════
   TYPING BAR
═══════════════════════════════════════════ */
.typing-bar{
  display:none;
  position:absolute;left:0;right:132px;bottom:68px;
  height:18px;line-height:18px;z-index:38;
  background:var(--do-bg-surface);
  color:var(--do-text-muted);
  padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:11px;pointer-events:none;
  border-top:1px solid var(--do-border)
}
.chat-wrapper.has-typing .typing-bar{display:block}
.chat-wrapper.has-typing .chat-messages-container{bottom:90px!important}
body.chat-locked .chat-wrapper.has-typing .chat-messages-container{bottom:68px!important}
.typing-bar .typing-name{color:var(--do-accent);font-weight:700}
.typing-bar .typing-status-word{color:var(--do-text-muted)}

/* ═══════════════════════════════════════════
   REPLY PREVIEW
═══════════════════════════════════════════ */
.chat-reply-preview{
  display:none;position:absolute;
  left:5px;right:132px;bottom:68px;
  min-height:30px;max-height:54px;
  background:var(--do-bg-surface);
  border-top:2px solid var(--do-border);
  color:var(--do-text-primary);z-index:28;padding:5px 32px 5px 10px;
  overflow:hidden;box-sizing:border-box
}
.chat-wrapper.replying .chat-reply-preview{display:block}
.chat-wrapper.replying .chat-messages-container{bottom:100px!important}
.chat-wrapper.replying.has-typing .chat-messages-container{bottom:118px!important}
.chat-reply-preview::before{
  content:'';position:absolute;left:5px;top:6px;bottom:6px;
  width:3px;background:var(--do-accent);border-radius:2px
}
.reply-preview-title{
  padding-left:10px;font-size:11px;color:var(--do-accent);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.reply-preview-text{
  padding-left:10px;padding-top:2px;font-size:12px;color:var(--do-text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.reply-preview-close{
  position:absolute;top:5px;right:8px;width:20px;height:20px;
  border:0;background:transparent;color:var(--do-text-muted);cursor:pointer;font-size:18px;padding:0
}
.reply-preview-close:hover{color:var(--do-text-primary)}
.msg-reply-quote{
  display:block;margin:0 0 4px;padding:4px 7px 4px 9px;
  border-left:3px solid var(--do-accent);
  background:rgba(0,168,255,.06);
  color:var(--do-text-secondary);max-width:min(340px,88%);cursor:pointer;overflow:hidden;
  border-radius:0 4px 4px 0
}
.msg-reply-quote:hover{background:rgba(0,168,255,.1)}
.msg-reply-name{display:block;color:var(--do-accent);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-reply-text{display:block;color:var(--do-text-secondary);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══════════════════════════════════════════
   UPLOAD PROGRESS — شريط 3px في أسفل الشاشة
═══════════════════════════════════════════ */
.upload-progress-wrap{
  position:fixed;left:0;right:0;bottom:0;height:3px;
  z-index:520;background:transparent;display:none;overflow:hidden
}
.upload-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--do-accent),var(--do-green),var(--do-accent));
  background-size:200% 100%;
  animation:progressShimmer 1.4s linear infinite;
  border-radius:0;
  transition:width .18s linear
}
@keyframes progressShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* نسبة الرفع */
.upload-pct-badge{
  position:fixed;bottom:6px;right:10px;
  background:rgba(4,13,33,.9);
  border:1px solid var(--do-border);
  border-radius:20px;padding:2px 10px;
  font-size:10px;font-weight:700;color:var(--do-green);
  z-index:521;display:none;
  font-family:'JetBrains Mono',monospace
}

/* ═══════════════════════════════════════════
   MESSAGES LOADING — Progress Bar
═══════════════════════════════════════════ */
.msgs-buffering{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--do-bg-base);z-index:15;pointer-events:none;
  transition:opacity .3s ease
}
.msgs-buffering.hiding{opacity:0}
.msgs-buffering-bar-track{
  width:180px;height:3px;
  background:rgba(0,168,255,.12);
  border-radius:3px;overflow:hidden
}
.msgs-buffering-bar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--do-accent),var(--do-green));
  background-size:200% 100%;
  animation:progressShimmer 1.4s linear infinite;
  border-radius:3px
}
.msgs-buffering-row{
  display:flex;align-items:center;gap:8px
}
.msgs-buffering-pct{
  font-size:12px;font-weight:700;color:var(--do-accent);
  min-width:38px;text-align:center;
  font-family:'JetBrains Mono',monospace
}
.msgs-buffering-label{font-size:11px;color:var(--do-text-muted);font-family:'Cairo',sans-serif}

/* ═══════════════════════════════════════════
   UPLOAD FILE PREVIEW
═══════════════════════════════════════════ */
.upload-preview-bar[style*="flex"]{
  display:flex!important;position:fixed;
  left:10px;right:142px;bottom:116px;z-index:410;
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:8px;padding:6px;gap:6px;flex-wrap:wrap
}
.preview-item{position:relative;display:inline-flex}
.preview-thumb{width:46px;height:46px;object-fit:cover;border-radius:6px}
.preview-file-chip{
  background:var(--do-bg-elevated);color:var(--do-text-primary);border-radius:6px;
  padding:6px 8px;font-size:11px;max-width:170px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:1px solid var(--do-border)
}
.preview-remove{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;
  border-radius:50%;border:0;background:#e53e3e;color:#fff;font-size:10px;cursor:pointer
}

/* IOS Note */
.ios-upload-note{
  position:fixed;left:10px;right:142px;bottom:92px;z-index:430;
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  color:var(--do-text-secondary);border-radius:8px;
  padding:7px 9px;font-size:11px;line-height:1.35;display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4)
}
.ios-upload-note.show{display:block}

/* ═══════════════════════════════════════════
   PLYR — VIDEO
═══════════════════════════════════════════ */
.plyr-video-wrap{
  width:min(520px,100%);max-width:100%;margin-top:6px;
  background:#000;
  border:1px solid var(--do-border);
  border-radius:8px;overflow:hidden
}
.plyr-video-wrap video{width:100%;max-height:70vh;background:#000;display:block}
.plyr-video-wrap .plyr{
  --plyr-color-main:var(--do-accent);--plyr-video-background:#000;
  --plyr-control-radius:4px;--plyr-control-icon-size:15px;
  --plyr-control-spacing:8px;
  --plyr-video-controls-background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.75));
  width:100%;max-width:100%
}
.plyr-video-wrap .plyr__controls{direction:ltr!important;padding:8px}
.plyr-video-fallback{
  margin-top:6px;background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:8px;padding:9px;color:var(--do-text-secondary);font-size:12px;line-height:1.55
}
.plyr-video-fallback a{display:none!important}
.video-needs-conversion-card{
  display:block;max-width:min(330px,100%);background:var(--do-bg-card);
  border:1px solid var(--do-border);border-radius:8px;padding:10px;
  margin-top:6px;color:var(--do-text-secondary);font-size:12px;line-height:1.55
}
.video-needs-conversion-card .vc-title{font-weight:700;color:var(--do-amber);margin-bottom:3px}
.video-needs-conversion-card .vc-name{color:var(--do-text-muted);word-break:break-word;margin-top:3px}

/* ═══════════════════════════════════════════
   PLYR — AUDIO
═══════════════════════════════════════════ */
.plyr-audio-wrap{
  max-width:min(300px,100%);margin-top:6px;
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:8px;padding:6px
}
.plyr-audio-wrap .plyr{
  --plyr-color-main:var(--do-accent);
  --plyr-audio-controls-background:var(--do-bg-card);
  --plyr-audio-control-color:var(--do-text-primary);
  --plyr-control-radius:4px;--plyr-control-icon-size:15px;--plyr-control-spacing:8px
}
.plyr-audio-wrap .plyr__controls{padding:4px!important;background:var(--do-bg-card)!important;color:var(--do-text-primary)!important}
.plyr-audio-wrap .plyr__controls [data-plyr="mute"],
.plyr-audio-wrap .plyr__controls .plyr__volume{display:none!important}

/* ═══════════════════════════════════════════
   CONTEXT MENUS
═══════════════════════════════════════════ */
.attach-choice-menu,.msg-context-menu{
  position:fixed;z-index:500;display:none;
  background:var(--do-bg-card);
  border:1px solid rgba(0,168,255,.2);
  border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(0,200,255,.05);
  overflow:hidden;color:var(--do-text-primary);font-family:inherit;min-width:190px;direction:rtl
}
.attach-choice-menu.show,.msg-context-menu.show{display:block}
.attach-choice-menu button{
  display:flex;align-items:center;gap:8px;width:100%;border:0;
  background:transparent;color:var(--do-text-primary);text-align:right;
  padding:10px 14px;font-family:inherit;font-size:13px;cursor:pointer;
  white-space:nowrap;direction:rtl;
  transition:background .12s
}
.attach-choice-menu button:hover{background:var(--do-bg-hover);color:var(--do-accent)}
.ctx-section{padding:4px 0}
.ctx-sep{height:1px;background:var(--do-border);margin:2px 0}
.ctx-btn{
  display:flex;align-items:center;gap:9px;width:100%;border:0;
  background:transparent;color:var(--do-text-primary);text-align:right;
  padding:10px 14px;font-family:inherit;font-size:13px;cursor:pointer;
  white-space:nowrap;direction:rtl;transition:background .12s
}
.ctx-btn:hover{background:var(--do-bg-hover)}
.ctx-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;line-height:1}
.ctx-label{flex:1;text-align:right}
.ctx-btn.reply-action{color:var(--do-accent);font-weight:700}
.ctx-btn.reply-action:hover{background:var(--do-accent-dim)}
.ctx-btn.danger{color:#f87171}
.ctx-btn.danger:hover{background:rgba(248,113,113,.08)}
.ctx-divider-label{
  padding:4px 14px 3px;font-size:9px;color:var(--do-text-muted);
  font-weight:700;letter-spacing:.5px;text-align:right;direction:rtl
}

/* ═══════════════════════════════════════════
   MESSAGE EDIT
═══════════════════════════════════════════ */
.msg-edit-wrap{
  display:block;margin:6px 0 2px;
  background:var(--do-bg-card);
  border:1px solid var(--do-border-focus);
  border-radius:10px;padding:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.3)
}
.msg-edit-input{
  width:100%;min-height:70px;resize:vertical;
  background:var(--do-bg-input);
  color:var(--do-text-primary);
  border:1px solid var(--do-border);
  border-radius:7px;padding:8px 10px;font:14px/1.5 inherit;outline:none;box-sizing:border-box
}
.msg-edit-input:focus{border-color:var(--do-border-focus);box-shadow:0 0 0 2px var(--do-accent-dim)}
.msg-edit-btns{display:flex;gap:7px;margin-top:7px;justify-content:flex-end}
.msg-edit-save,.msg-edit-cancel{
  border:0;border-radius:6px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer;
  transition:opacity .15s
}
.msg-edit-save{background:var(--do-accent);color:#040d21;font-weight:700}
.msg-edit-save:hover{opacity:.85}
.msg-edit-cancel{background:var(--do-bg-elevated);color:var(--do-text-secondary);border:1px solid var(--do-border)}

/* ═══════════════════════════════════════════
   LIGHTBOX
═══════════════════════════════════════════ */
.lightbox{
  position:fixed;inset:0;background:rgba(4,13,33,.96);z-index:200;
  display:none;align-items:center;justify-content:center;
  padding:12px;overflow:hidden;touch-action:none
}
.lightbox.open{display:flex}
.lightbox-viewport{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;cursor:grab
}
.lightbox img{
  max-width:92vw;max-height:88dvh;border-radius:8px;
  border:1px solid var(--do-border);
  box-shadow:0 16px 64px rgba(0,0,0,.8);
  object-fit:contain;user-select:none;-webkit-user-drag:none;touch-action:none;
  transform:translate3d(0,0,0) scale(1);transform-origin:center center;
  transition:transform .08s linear;will-change:transform
}
.lightbox-close{
  position:absolute;top:12px;right:14px;
  background:rgba(0,168,255,.15);
  border:1px solid var(--do-border);
  color:var(--do-text-primary);cursor:pointer;border-radius:50%;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  z-index:205;font-size:22px;
  transition:background .15s
}
.lightbox-close:hover{background:rgba(0,168,255,.3)}
.lightbox-toolbar{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  display:flex;align-items:center;gap:7px;
  background:rgba(4,13,33,.8);
  border:1px solid var(--do-border);
  border-radius:999px;padding:6px 8px;z-index:205
}
.lightbox-zoom-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--do-border);
  background:rgba(0,168,255,.1);color:var(--do-text-primary);cursor:pointer;font-size:18px;
  transition:background .15s
}
.lightbox-zoom-btn:hover{background:rgba(0,168,255,.25)}
.lightbox-reset-btn{width:auto;min-width:54px;border-radius:999px;font-size:12px;padding:0 12px}
.lightbox-zoom-level{min-width:46px;text-align:center;color:var(--do-text-secondary);font-size:12px}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  color:var(--do-text-primary);padding:8px 16px;border-radius:20px;font-size:12px;
  z-index:9999;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 4px 20px rgba(0,0,0,.4)
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:rgba(127,29,29,.95);border-color:rgba(248,113,113,.3);color:#f87171}
.toast.success{background:rgba(0,55,40,.95);border-color:rgba(0,229,160,.3);color:var(--do-green)}

/* ═══════════════════════════════════════════
   VOICE RECORDER
═══════════════════════════════════════════ */
.voice-recorder-overlay{
  position:fixed;left:50%;bottom:46px;
  transform:translateX(-50%) translateY(20px);
  z-index:650;display:none;
  min-width:260px;max-width:min(92vw,420px);
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  color:var(--do-text-primary);
  padding:10px 12px;direction:rtl;
  opacity:0;transition:opacity .18s,transform .18s
}
.voice-recorder-overlay.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
.voice-recorder-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--do-text-secondary)}
.voice-rec-dot{width:8px;height:8px;border-radius:50%;background:#f87171;animation:voiceDot 1s infinite}
@keyframes voiceDot{
  0%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}
  70%{box-shadow:0 0 0 8px rgba(248,113,113,0)}
  100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}
}
.voice-rec-timer{font-size:18px;font-weight:700;color:var(--do-text-primary);font-variant-numeric:tabular-nums;margin-inline-start:auto;direction:ltr}
.voice-rec-actions{display:flex;gap:8px;align-items:center}
.voice-rec-actions button{border:0;border-radius:7px;padding:7px 12px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s}
.voice-stop-send{background:rgba(0,229,160,.12);color:var(--do-green);border:1px solid rgba(0,229,160,.3)!important;font-weight:700}
.voice-stop-send:hover{background:rgba(0,229,160,.22)!important}
.voice-cancel{background:rgba(248,113,113,.08);color:#f87171;border:1px solid rgba(248,113,113,.2)!important}
.voice-cancel:hover{background:rgba(248,113,113,.16)!important}

/* ═══════════════════════════════════════════
   GIF PICKER
═══════════════════════════════════════════ */
.gif-picker-overlay{
  position:fixed;inset:0;z-index:700;display:none;
  background:rgba(4,13,33,.7);backdrop-filter:blur(8px);
  align-items:flex-end;justify-content:center;direction:rtl
}
.gif-picker-overlay.show{display:flex}
.gif-picker{
  width:min(560px,calc(100vw - 16px));max-height:min(580px,86dvh);
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:16px 16px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;overflow:hidden;color:var(--do-text-primary)
}
.gif-picker-head{display:flex;align-items:center;gap:8px;padding:10px;background:var(--do-bg-surface);border-bottom:1px solid var(--do-border)}
.gif-picker-title{font-weight:700;font-size:13px;color:var(--do-text-primary);white-space:nowrap}
.gif-picker-search{
  flex:1;background:var(--do-bg-input);border:1px solid var(--do-border);border-radius:7px;
  color:var(--do-text-primary);padding:8px 10px;font:13px inherit;outline:none;direction:rtl;
  transition:border-color .15s
}
.gif-picker-search:focus{border-color:var(--do-border-focus)}
.gif-picker-close{
  border:1px solid var(--do-border);background:var(--do-bg-elevated);color:var(--do-text-secondary);border-radius:7px;
  width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;
  transition:all .15s
}
.gif-picker-close:hover{background:var(--do-bg-hover);color:var(--do-accent)}
.gif-picker-note{font-size:11px;color:var(--do-text-muted);padding:7px 10px;border-bottom:1px solid var(--do-border);background:var(--do-bg-surface);line-height:1.5}
.gif-grid{padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;overflow:auto;min-height:160px}
.gif-card{
  border:1px solid var(--do-border);background:var(--do-bg-surface);border-radius:8px;
  overflow:hidden;cursor:pointer;min-height:92px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,transform .15s
}
.gif-card:hover{border-color:var(--do-accent);transform:translateY(-1px)}
.gif-card img{width:100%;height:112px;object-fit:cover;display:block}
.gif-empty{grid-column:1/-1;text-align:center;color:var(--do-text-muted);padding:28px 8px;font-size:12px;line-height:1.6}

/* ═══════════════════════════════════════════
   EMOJI PICKER
═══════════════════════════════════════════ */
.emoji-picker-overlay{
  position:fixed;inset:0;z-index:720;display:none;
  background:rgba(4,13,33,.6);backdrop-filter:blur(8px);
  align-items:flex-end;justify-content:center
}
.emoji-picker-overlay.show{display:flex}
.emoji-picker{
  width:min(540px,calc(100vw - 12px));max-height:min(420px,78dvh);
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:16px 16px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;overflow:hidden;direction:rtl
}
.emoji-picker-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--do-bg-surface);border-bottom:1px solid var(--do-border);flex-shrink:0
}
.emoji-picker-title{font-weight:700;font-size:13px;color:var(--do-text-primary);flex:1}
.emoji-picker-search{
  flex:2;background:var(--do-bg-input);border:1px solid var(--do-border);border-radius:7px;
  color:var(--do-text-primary);padding:7px 10px;font:13px inherit;outline:none;direction:rtl;
  transition:border-color .15s
}
.emoji-picker-search:focus{border-color:var(--do-border-focus)}
.emoji-picker-close{
  border:1px solid var(--do-border);background:var(--do-bg-elevated);color:var(--do-text-secondary);border-radius:7px;
  width:30px;height:30px;cursor:pointer;font-size:16px;
  transition:all .15s
}
.emoji-picker-close:hover{color:var(--do-accent);background:var(--do-bg-hover)}
.emoji-cats{
  display:flex;gap:4px;padding:8px 10px 4px;overflow-x:auto;
  background:var(--do-bg-surface);border-bottom:1px solid var(--do-border);flex-shrink:0
}
.emoji-cat-btn{
  border:0;background:transparent;border-radius:7px;
  padding:5px 8px;cursor:pointer;font-size:18px;
  transition:background .12s;flex-shrink:0
}
.emoji-cat-btn:hover,.emoji-cat-btn.active{background:var(--do-bg-elevated)}
.emoji-grid{
  flex:1;overflow-y:auto;padding:8px;
  display:grid;grid-template-columns:repeat(auto-fill,38px);gap:2px;align-content:start
}
.emoji-btn{
  width:38px;height:38px;border:0;background:transparent;border-radius:8px;
  cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;
  transition:background .12s;line-height:1
}
.emoji-btn:hover{background:var(--do-bg-elevated)}

/* ═══════════════════════════════════════════
   SOCIAL EMBEDS
═══════════════════════════════════════════ */
.social-embed-wrap{display:flex;flex-direction:column;gap:8px;margin-top:7px;max-width:100%}
.social-embed-card{
  width:min(520px,100%);
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:10px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.3);box-sizing:border-box
}
.social-embed-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 9px;
  background:var(--do-bg-surface);
  color:var(--do-text-secondary);font-size:11px;font-weight:700
}
.social-embed-platform{display:flex;align-items:center;gap:6px;min-width:0}
.social-embed-platform::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--do-accent);display:inline-block;flex:0 0 7px}
.social-embed-note{font-size:10px;color:var(--do-text-muted);font-weight:500;white-space:nowrap}
.social-embed-frame{width:100%;border:0;display:block;background:#000}
.social-embed-youtube{aspect-ratio:16/9;min-height:220px}
.social-embed-vertical{aspect-ratio:9/16;max-height:560px;min-height:380px}
.social-embed-facebook{height:520px}
.social-embed-instagram-card{background:#fff;padding:0;min-height:360px}
.social-embed-instagram-card .instagram-media{min-width:0!important;width:100%!important;max-width:100%!important;margin:0!important}
.social-embed-fallback{padding:10px;color:var(--do-text-secondary);font-size:12px;line-height:1.6;background:var(--do-bg-surface)}
.social-embed-fallback a{color:var(--do-accent);text-decoration:none;word-break:break-word}

/* ═══════════════════════════════════════════
   ACCESS CODE DIALOG
═══════════════════════════════════════════ */
.access-code-overlay{
  position:fixed;inset:0;z-index:900;display:none;
  align-items:center;justify-content:center;
  background:rgba(4,13,33,.8);backdrop-filter:blur(12px);direction:rtl;padding:18px
}
.access-code-overlay.show{display:flex}
.access-code-dialog{
  width:min(330px,92vw);
  background:var(--do-bg-card);
  border:1px solid rgba(0,168,255,.3);
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(0,168,255,.08);
  padding:20px;color:var(--do-text-primary)
}
.access-code-title{font-size:15px;font-weight:800;color:var(--do-text-primary);margin-bottom:10px;text-align:center}
.access-code-input{
  width:100%;height:44px;border-radius:9px;
  border:1px solid var(--do-border);
  background:var(--do-bg-input);
  color:var(--do-text-primary);font:18px inherit;
  text-align:center;letter-spacing:6px;outline:none;box-sizing:border-box;
  transition:border-color .15s
}
.access-code-input:focus{border-color:var(--do-border-focus);box-shadow:0 0 0 3px var(--do-accent-dim)}
.access-code-error{display:none;color:#f87171;font-size:12px;text-align:center;margin-top:8px}
.access-code-actions{display:flex;gap:8px;margin-top:13px}
.access-code-actions button{flex:1;border:0;border-radius:8px;height:38px;font:13px inherit;cursor:pointer;transition:opacity .15s}
.access-code-ok{background:var(--do-accent);color:#040d21;font-weight:700}
.access-code-ok:hover{opacity:.85}
.access-code-cancel{background:var(--do-bg-elevated);color:var(--do-text-secondary);border:1px solid var(--do-border)!important}

/* ═══════════════════════════════════════════
   SELECTION TOOLBAR
═══════════════════════════════════════════ */
.selection-toolbar{
  position:fixed;left:50%;
  bottom:calc(42px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:260;
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);padding:7px;
  display:none;gap:6px;align-items:center;color:var(--do-text-primary);font-size:12px;direction:rtl
}
.selection-toolbar.show{display:flex}
.selection-toolbar button{
  border:0;border-radius:6px;
  background:var(--do-bg-elevated);
  color:var(--do-text-primary);
  padding:6px 9px;font-family:inherit;font-size:12px;cursor:pointer;
  transition:background .15s
}
.selection-toolbar button:hover{background:var(--do-bg-hover)}
.selection-toolbar button.danger{background:rgba(248,113,113,.1);color:#f87171}
.selection-toolbar button.danger:hover{background:rgba(248,113,113,.18)}

/* ═══════════════════════════════════════════
   NEWS BOARD — داخل حاوية مستقلة
═══════════════════════════════════════════ */
.public-news-board{
  padding:0 0 20px;direction:rtl;display:flex;flex-direction:column;
  color:var(--do-text-primary);background:var(--do-bg-base);
  font-family:'Cairo','Plus Jakarta Sans',sans-serif;
  min-height:100%
}
.news-board-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 12px 10px;
  background:rgba(4,13,33,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--do-border);
  position:sticky;top:0;z-index:10;flex-shrink:0
}
.news-board-title{
  font-size:13px;font-weight:900;color:var(--do-text-primary);
  font-family:'Cairo',sans-serif;letter-spacing:-.2px;
  display:flex;align-items:center;gap:7px
}
.news-board-title-icon{font-size:16px}
.news-board-subtitle{font-size:10px;color:var(--do-accent);font-weight:700;display:flex;align-items:center;gap:5px}
.news-live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--do-green);flex-shrink:0;
  animation:newsLivePulse 2s infinite
}
@keyframes newsLivePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}

/* News load progress */
.news-load-progress{
  position:sticky;top:0;left:0;right:0;height:2px;z-index:11;
  background:rgba(0,168,255,.08);overflow:hidden;display:none
}
.news-load-progress.active{display:block}
.news-load-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--do-accent),var(--do-green));
  background-size:200% 100%;
  animation:progressShimmer 1.4s linear infinite;
  transition:width .3s ease
}

.news-cards-grid{display:flex;flex-direction:column;gap:0;flex:1}
.news-card{
  position:relative;display:flex;flex-direction:column;
  margin:8px 8px 0;border-radius:14px;overflow:hidden;
  border:1px solid var(--do-border);
  background:var(--do-bg-card);cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  box-shadow:0 4px 20px rgba(0,0,0,.3);isolation:isolate
}
.news-card:last-child{margin-bottom:8px}
.news-card:hover{transform:translateY(-2px);border-color:rgba(0,168,255,.35);box-shadow:0 10px 35px rgba(0,0,0,.45)}
.news-card:active{transform:translateY(0)}
.news-thumb-wrap{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--do-bg-surface);flex-shrink:0}
.news-thumb{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.news-card:hover .news-thumb{transform:scale(1.04)}
.news-source-badge-img{
  position:absolute;bottom:7px;right:8px;
  background:rgba(4,13,33,.8);backdrop-filter:blur(6px);
  border-radius:6px;padding:2px 8px;
  font-size:9px;color:var(--do-text-primary);font-weight:700;
  font-family:'Cairo',sans-serif;
  border:1px solid var(--do-border)
}
.news-thumb-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(4,13,33,.75));pointer-events:none}
.news-card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px}
.news-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.news-tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:9px;font-weight:800;font-family:'Cairo',sans-serif;letter-spacing:.3px;border:1px solid transparent;
  text-transform:uppercase
}
/* Deep Ocean tag colors */
.news-tag.t-ai    {background:rgba(0,200,255,.1);border-color:rgba(0,200,255,.3);color:var(--do-accent)}
.news-tag.t-mobile{background:rgba(0,229,160,.08);border-color:rgba(0,229,160,.25);color:var(--do-green)}
.news-tag.t-soft  {background:rgba(124,77,255,.1);border-color:rgba(124,77,255,.3);color:#b39dff}
.news-tag.t-hw    {background:rgba(255,171,64,.1);border-color:rgba(255,171,64,.3);color:var(--do-amber)}
.news-tag.t-net   {background:rgba(0,168,255,.08);border-color:rgba(0,168,255,.25);color:#7dd3fc}
.news-tag.t-sec   {background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.25);color:#f87171}
.news-date-badge{font-size:9px;color:var(--do-text-muted);white-space:nowrap}
.news-card .news-title{
  font-size:13px;line-height:1.45;font-weight:800;color:var(--do-text-primary);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  font-family:'Cairo',sans-serif;letter-spacing:-.1px
}
.news-card .news-desc{
  font-size:11px;line-height:1.5;color:var(--do-text-secondary);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.news-card-footer{
  display:flex;align-items:center;gap:6px;padding-top:5px;
  border-top:1px solid var(--do-border)
}
.news-source-dot{width:5px;height:5px;border-radius:50%;background:var(--do-green);flex-shrink:0}
.news-source-name{font-size:9px;color:var(--do-text-muted);flex:1}
.news-read-chip{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--do-accent-dim);
  border:1px solid rgba(0,200,255,.2);
  color:var(--do-accent);
  border-radius:999px;padding:2px 8px;font-size:9px;font-weight:700;
  font-family:'Cairo',sans-serif;white-space:nowrap
}
.news-card.loading-news{
  justify-content:center;align-items:center;min-height:100px;
  color:var(--do-text-muted);font-size:12px;padding:20px;text-align:center;
  background:var(--do-bg-base);border:1px dashed var(--do-border);border-radius:14px;margin:8px
}
.news-loading-spinner{
  width:28px;height:28px;
  border:2px solid var(--do-border);
  border-top-color:var(--do-accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 8px
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════════
   NEWS PREVIEW SHEET
═══════════════════════════════════════════ */
.news-preview-overlay{
  position:fixed;inset:0;z-index:950;
  background:rgba(4,13,33,.85);backdrop-filter:blur(12px);
  display:none;align-items:flex-end;justify-content:center
}
.news-preview-overlay.show{display:flex}
.news-preview-sheet{
  width:min(640px,100vw);max-height:90dvh;
  background:var(--do-bg-card);
  border:1px solid var(--do-border);
  border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;overflow:hidden;direction:rtl;
  color:var(--do-text-primary);
  font-family:'Cairo','Plus Jakarta Sans',sans-serif;
  box-shadow:0 -16px 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,200,255,.08)
}
.news-preview-handle{width:40px;height:4px;border-radius:2px;background:var(--do-border);margin:10px auto 0;flex-shrink:0}
.news-preview-img-wrap{width:100%;aspect-ratio:16/9;flex-shrink:0;overflow:hidden;background:var(--do-bg-surface);margin-top:10px}
.news-preview-img{width:100%;height:100%;object-fit:cover;display:block}
.news-preview-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--do-bg-surface)}
.news-preview-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:rgba(0,168,255,.15) transparent}
.news-preview-tag{
  display:inline-flex;padding:2px 8px;border-radius:999px;
  background:var(--do-accent-dim);border:1px solid rgba(0,200,255,.25);
  color:var(--do-accent);font-size:9px;font-weight:800;margin-bottom:8px;font-family:'Cairo',sans-serif;
  text-transform:uppercase
}
.news-preview-title{font-size:16px;font-weight:900;color:var(--do-text-primary);line-height:1.45;margin-bottom:6px;font-family:'Cairo',sans-serif}
.news-preview-meta{font-size:10px;color:var(--do-text-muted);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.news-preview-meta-dot{width:3px;height:3px;border-radius:50%;background:var(--do-text-muted)}
.news-preview-content-box{
  background:var(--do-bg-surface);
  border:1px solid var(--do-border);
  border-radius:12px;padding:12px;margin-bottom:12px
}
.news-preview-content-header{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ai-sparkle{
  width:22px;height:22px;border-radius:7px;
  background:linear-gradient(135deg,var(--do-accent),var(--do-purple));
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0
}
.news-preview-content-label{font-size:11px;font-weight:800;color:var(--do-accent);font-family:'Cairo',sans-serif;letter-spacing:.3px}

/* News fetch progress bar */
.news-fetch-progress{height:2px;background:var(--do-border);border-radius:2px;overflow:hidden;margin-bottom:8px;display:none}
.news-fetch-progress.active{display:block}
.news-fetch-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--do-accent),var(--do-green));
  background-size:200% 100%;
  animation:progressShimmer 1.4s linear infinite;
  transition:width .4s ease
}

.news-preview-loading{display:flex;align-items:center;gap:8px;color:var(--do-text-muted);font-size:12px}
.news-preview-loading-dots{display:flex;gap:4px}
.news-preview-loading-dot{width:5px;height:5px;border-radius:50%;background:var(--do-accent);animation:previewDot 1.2s infinite}
.news-preview-loading-dot:nth-child(2){animation-delay:.2s}
.news-preview-loading-dot:nth-child(3){animation-delay:.4s}
@keyframes previewDot{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.news-preview-content-text{
  font-size:13px;line-height:1.9;color:var(--do-text-secondary);
  font-family:'Cairo',sans-serif;
  border-right:3px solid var(--do-accent);padding-right:12px
}
.news-preview-actions{display:flex;gap:8px;padding:10px;border-top:1px solid var(--do-border);flex-shrink:0}
.news-preview-open{
  flex:1;background:var(--do-accent);color:#040d21;border:none;border-radius:12px;
  height:44px;font:700 13px 'Cairo',sans-serif;cursor:pointer;transition:opacity .15s
}
.news-preview-open:hover{opacity:.85}
.news-preview-close-btn{
  background:var(--do-bg-elevated);color:var(--do-text-secondary);
  border:1px solid var(--do-border);border-radius:12px;
  height:44px;padding:0 16px;font:600 12px 'Cairo',sans-serif;cursor:pointer;
  transition:all .15s
}
.news-preview-close-btn:hover{background:var(--do-bg-hover);color:var(--do-text-primary)}

/* Instagram in-app hint */
.inapp-browser-hint{
  display:none;position:fixed;left:8px;right:8px;top:8px;z-index:999999;
  direction:rtl;background:rgba(4,13,33,.97);
  border:1px solid rgba(0,229,160,.4);
  color:var(--do-text-primary);border-radius:10px;
  padding:9px 10px;font-size:12px;line-height:1.5;
  box-shadow:0 8px 26px rgba(0,0,0,.4)
}

.inapp-browser-hint button{
  float:left;background:var(--do-bg-elevated);color:var(--do-text-secondary);
  border:1px solid var(--do-border);border-radius:7px;padding:4px 8px;font:inherit

var lb={scale:1,x:0,y:0,dragging:false,lastX:0,lastY:0,pinchStartDist:0,pinchStartScale:1};
function clamp(n,min,max){return Math.min(Math.max(n,min),max);}
function updateLbTransform(){ var img=document.getElementById('lightboxImg'),lvl=document.getElementById('lightboxZoomLevel');if(!img)return;lb.scale=clamp(lb.scale,1,5);if(lb.scale<=1.001){lb.scale=1;lb.x=0;lb.y=0;}img.style.transform='translate3d('+lb.x+'px,'+lb.y+'px,0) scale('+lb.scale+')';if(lvl)lvl.textContent=Math.round(lb.scale*100)+'%'; }
function resetLb(){lb.scale=1;lb.x=0;lb.y=0;updateLbTransform();}
function zoomLb(delta,cx,cy){var old=lb.scale,next=clamp(old+delta,1,5);if(next===old)return;if(cx!=null&&cy!=null){var vw=window.innerWidth/2,vh=window.innerHeight/2;lb.x-=(cx-vw)*(next-old)/Math.max(next,1);lb.y-=(cy-vh)*(next-old)/Math.max(next,1);}lb.scale=next;updateLbTransform();}
function closeLightbox(){var el=document.getElementById('lightbox'),img=document.getElementById('lightboxImg');if(el)el.classList.remove('open');if(img)img.src='';resetLb();}
function openLightbox(url){resetLb();document.getElementById('lightboxImg').src=url;document.getElementById('lightbox').classList.add('open');}
document.getElementById('lightboxClose').addEventListener('click',closeLightbox);
document.getElementById('lightboxZoomIn').addEventListener('click',function(){zoomLb(.35);});
document.getElementById('lightboxZoomOut').addEventListener('click',function(){zoomLb(-.35);});
document.getElementById('lightboxZoomReset').addEventListener('click',resetLb);
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
document.getElementById('lightboxViewport').addEventListener('wheel',function(e){e.preventDefault();zoomLb(e.deltaY<0?.25:-.25,e.clientX,e.clientY);},{passive:false});
document.getElementById('lightboxViewport').addEventListener('mousedown',function(e){if(lb.scale<=1)return;lb.dragging=true;lb.lastX=e.clientX;lb.lastY=e.clientY;this.classList.add('dragging');});
window.addEventListener('mousemove',function(e){if(!lb.dragging)return;lb.x+=e.clientX-lb.lastX;lb.y+=e.clientY-lb.lastY;lb.lastX=e.clientX;lb.lastY=e.clientY;updateLbTransform();});
window.addEventListener('mouseup',function(){lb.dragging=false;var vp=document.getElementById('lightboxViewport');if(vp)vp.classList.remove('dragging');});
document.getElementById('lightboxViewport').addEventListener('touchstart',function(e){if(e.touches.length===1){lb.dragging=lb.scale>1;lb.lastX=e.touches[0].clientX;lb.lastY=e.touches[0].clientY;}else if(e.touches.length===2){lb.dragging=false;lb.pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);lb.pinchStartScale=lb.scale;}},{passive:false});
document.getElementById('lightboxViewport').addEventListener('touchmove',function(e){if(e.touches.length===2){e.preventDefault();var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lb.pinchStartDist>0){lb.scale=clamp(lb.pinchStartScale*(dist/lb.pinchStartDist),1,5);updateLbTransform();}}else if(e.touches.length===1&&lb.dragging){e.preventDefault();var t=e.touches[0];lb.x+=t.clientX-lb.lastX;lb.y+=t.clientY-lb.lastY;lb.lastX=t.clientX;lb.lastY=t.clientY;updateLbTransform();}},{passive:false});
document.getElementById('lightboxViewport').addEventListener('touchend',function(){lb.dragging=false;lb.pinchStartDist=0;});
window.addEventListener('keydown',function(e){var el=document.getElementById('lightbox');if(!el||!el.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();else if(e.key==='+'||e.key==='=')zoomLb(.35);else if(e.key==='-'||e.key==='_')zoomLb(-.35);else if(e.key==='0')resetLb();});

   NEWS SYSTEM
   
   FIX: استخدام CORS Proxies للوصول لـ RSS مباشرة
   بدلاً من rss2json.com الذي يُرجع 422
   
   المصادر: مقروءة مباشرة كـ XML عبر proxies متعددة
════════════════════════════════════════════════════════ */
var NEWS_SOURCES = [
  { name:'The Verge',    url:'https://www.theverge.com/rss/index.xml',                    tag:'t-net',  tagLabel:'تقنية', lang:'en' },
  { name:'TechCrunch',  url:'https://techcrunch.com/feed/',                               tag:'t-ai',   tagLabel:'AI',    lang:'en' },
  { name:'Ars Technica',url:'https://feeds.arstechnica.com/arstechnica/technology-lab',   tag:'t-net',  tagLabel:'علوم',  lang:'en' },
  { name:'9to5Mac',     url:'https://9to5mac.com/feed/',                                  tag:'t-mob',  tagLabel:'Apple', lang:'en' },
  { name:'Android Auth',url:'https://www.androidauthority.com/feed/',                     tag:'t-mob',  tagLabel:'موبايل',lang:'en' },
  { name:'عرب هاردوير', url:'https://arabhardware.net/feed',                              tag:'t-hw',   tagLabel:'عتاد',  lang:'ar' },
];

// CORS Proxies — نجرب بالترتيب حتى ينجح أحدها
var CORS_PROXY_FNS = [
  function(u){ return 'https://corsproxy.io/?'+encodeURIComponent(u); },
  function(u){ return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u); },
  function(u){ return 'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u); },
];

function _newsSetProgress(pct){
  var bar=document.getElementById('newsLoadProgress'),fill=document.getElementById('newsLoadProgressFill');
  if(!bar||!fill) return;
  bar.classList.toggle('active',pct<100);
  fill.style.width=Math.min(pct,100)+'%';
}

async function _fetchRss(feedUrl){
  for(var pi=0; pi<CORS_PROXY_FNS.length; pi++){
    try{
      var proxyUrl = CORS_PROXY_FNS[pi](feedUrl);
      var ctrl = typeof AbortController!=='undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function(){ctrl.abort();},8000) : null;
      var resp = await fetch(proxyUrl, ctrl?{signal:ctrl.signal}:{});
      if(timer) clearTimeout(timer);
      if(!resp.ok) continue;
      var text = await resp.text();
      if(!text||text.length<100) continue;
      if(!text.includes('<item') && !text.includes('<entry')) continue;
      return _parseXmlRss(text);
    }catch(e){ /* try next proxy */ }
  }
  return [];
}

function _parseXmlRss(xmlText){
  try{
    var parser = new DOMParser();
    var doc = parser.parseFromString(xmlText,'text/xml');
    // RSS 2.0
    var items = Array.from(doc.querySelectorAll('item'));
    if(items.length){
      return items.map(function(item){
        var thumb = '';
        var enclosure = item.querySelector('enclosure');
        if(enclosure && /image/i.test(enclosure.getAttribute('type')||''))
          thumb = enclosure.getAttribute('url')||'';
        if(!thumb){
          var mediaThumbnail = item.getElementsByTagNameNS('http://search.yahoo.com/mrss/','thumbnail')[0] ||
                               item.getElementsByTagName('media:thumbnail')[0];
          if(mediaThumbnail) thumb = mediaThumbnail.getAttribute('url')||'';
        }
        var desc = item.querySelector('description');
        var descText = desc ? (desc.textContent||desc.innerHTML||'') : '';
        if(!thumb) thumb = _extractImgSrc(descText);
        return{
          title:   (item.querySelector('title')||{}).textContent||'',
          link:    (item.querySelector('link')||{}).textContent||(item.querySelector('link')||{}).getAttribute?.('href')||'',
          desc:    descText,
          pubDate: (item.querySelector('pubDate')||{}).textContent||'',
          thumb:   thumb
        };
      });
    }
    // Atom
    var entries = Array.from(doc.querySelectorAll('entry'));
    return entries.map(function(e){
      var linkEl = e.querySelector('link[rel="alternate"]') || e.querySelector('link');
      var desc = e.querySelector('summary')||e.querySelector('content');
      var descText = desc?(desc.textContent||desc.innerHTML||''):'';
      return{
        title:   (e.querySelector('title')||{}).textContent||'',
        link:    linkEl?(linkEl.getAttribute('href')||linkEl.textContent||''):'',
        desc:    descText,
        pubDate: (e.querySelector('updated')||e.querySelector('published')||{}).textContent||'',
        thumb:   _extractImgSrc(descText)
      };
    });
  }catch(e){ return []; }
}

function _extractImgSrc(html){
  var m=String(html||'').match(/<img[^>]+src=["']([^"']+)["']/i);
  return m?m[1]:'';
}
function _stripHtml(html){ var d=document.createElement('div');d.innerHTML=html;return(d.textContent||d.innerText||'').replace(/\s+/g,' ').trim(); }
function _fmtRelTime(dateStr){ if(!dateStr)return'';var d=new Date(dateStr);if(isNaN(d))return'';var diff=Math.floor((Date.now()-d)/1000);if(diff<60)return'الآن';if(diff<3600)return Math.floor(diff/60)+'د';if(diff<86400)return Math.floor(diff/3600)+'س';if(diff<604800)return Math.floor(diff/86400)+' يوم';return d.toLocaleDateString('ar-IQ',{month:'short',day:'numeric'}); }
function _fallbackThumb(text){var t=(text||'').toLowerCase();if(/apple|iphone|ipad|mac/i.test(t))return'https://images.unsplash.com/photo-1621580560968-a0d3d4c5d1ea?auto=format&fit=crop&w=800&q=70';if(/android|google|pixel/i.test(t))return'https://images.unsplash.com/photo-1526779259212-939e64788e3c?auto=format&fit=crop&w=800&q=70';if(/ai|openai|llm|gpt|claude|gemini|neural/i.test(t))return'https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800&q=70';if(/security|hack|cyber|breach/i.test(t))return'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=800&q=70';if(/chip|nvidia|amd|intel|cpu|gpu/i.test(t))return'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=70';if(/game|gaming|xbox|playstation/i.test(t))return'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=70';return'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=70'; }

// ترجمة مع timeout
function _trEn2Ar(text,msTimeout){
  if(!text||!text.trim())return Promise.resolve('');
  if(/[\u0600-\u06FF]/.test(text))return Promise.resolve(text);
  var short=text.slice(0,380);
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var pFetch=fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(short)+'&langpair=en|ar',ctrl?{signal:ctrl.signal}:{})
    .then(function(r){return r.json();})
    .then(function(j){return(j.responseData&&j.responseData.translatedText)||text;})
    .catch(function(){return text;});
  var pTimeout=new Promise(function(res){setTimeout(function(){if(ctrl)try{ctrl.abort();}catch(e){}res(text);},msTimeout||3500);});
  return Promise.race([pFetch,pTimeout]);
}

async function initializeDynamicNewsBoard(){
  if(state.current===AppState.UNLOCKED) return;
  var nc=document.getElementById('newsContainer'); if(!nc) return;

  _newsSetProgress(3);

  // عرض حالة التحميل داخل newsContainer
  nc.innerHTML='<div class="public-news-board"><div class="news-board-header"><span class="news-board-title"><span class="news-board-title-icon">📡</span> أحدث الأخبارالحالية</span><span class="news-board-subtitle"><span class="news-live-dot"></span>جاري التحميل...</span></div><div class="news-cards-grid"><div class="news-card loading-news"><div class="news-loading-spinner"></div>جاري جلب الأخبار الرائجة...</div></div></div>';

  var all=[], total=NEWS_SOURCES.length;

  for(var i=0; i<total; i++){
    if(state.current===AppState.UNLOCKED) return;
    var src=NEWS_SOURCES[i];
    _newsSetProgress(3+Math.round((i/total)*65));
    try{
      var items=await _fetchRss(src.url);
      for(var j=0; j<Math.min(items.length,5); j++){
        if(state.current===AppState.UNLOCKED) return;
        var item=items[j];
        if(!item.title||!item.title.trim()) continue;
        var rawTitle=item.title.trim().replace(/<!\[CDATA\[|\]\]>/g,'');
        var rawDesc=_stripHtml(item.desc||'').slice(0,250);
        var title=rawTitle, desc=rawDesc;
        if(src.lang==='en'){
          title=await _trEn2Ar(rawTitle,3000);
          if(state.current===AppState.UNLOCKED) return;
          desc=await _trEn2Ar(rawDesc.slice(0,180),2500);
        }
        if(state.current===AppState.UNLOCKED) return;
        all.push({title:title,desc:desc,img:item.thumb||'',link:item.link||'',date:item.pubDate||'',source:src.name,tag:src.tag,tagLabel:src.tagLabel,rawTitle:rawTitle,rawDesc:rawDesc});
      }
    }catch(e){ console.warn('Feed failed:',src.name,e); }
  }

  if(state.current===AppState.UNLOCKED) return;
  _newsSetProgress(95);

  // إزالة مكررات
  var seen=new Set();
  all=all.filter(function(a){var k=a.rawTitle.toLowerCase().trim().slice(0,55);if(seen.has(k))return false;seen.add(k);return true;});
  all.sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  _newsSetProgress(100);
  _renderNewsCards(all.slice(0,24), nc);
}

    html+='<div class="news-card loading-news">⚠️ تعذر تحميل الأخبار. تحقق من الاتصال.</div>';
  }else{
    articles.forEach(function(a){
      var img=a.img||_fallbackThumb(a.rawTitle||a.title);

        '<div class="news-thumb-wrap">'+
          '<img class="news-thumb" src="'+escHtml(img)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+escHtml(_fallbackThumb(''))+'\'"/>'+
          '<div class="news-thumb-gradient"></div>'+
          '<span class="news-source-badge-img">'+escHtml(a.source)+'</span>'+
        '</div>'+
        '<div class="news-card-body">'+
          '<div class="news-card-top">'+
            '<span class="news-tag '+a.tag+'">'+escHtml(a.tagLabel)+'</span>'+
            '<span class="news-date-badge">'+_fmtRelTime(a.date)+'</span>'+
          '</div>'+
          '<div class="news-title">'+escHtml(a.title||a.rawTitle||'')+'</div>'+
          (a.desc?'<div class="news-desc">'+escHtml(a.desc)+'</div>':'')+
          '<div class="news-card-footer">'+
            '<span class="news-source-dot"></span>'+

            '<span class="news-read-chip">اقرأ ›</span>'+

/* ════════════════════════════════════════════════════════
   NEWS PREVIEW — Claude يجلب النص الكامل
════════════════════════════════════════════════════════ */
function openNewsPreview(ndataEncoded){
  var data; try{data=JSON.parse(decodeURIComponent(ndataEncoded));}catch(e){return;}
  var sheet=document.getElementById('newsPreviewSheet'); if(!sheet) return;
  var imgHtml=data.img?'<img class="news-preview-img" src="'+escHtml(data.img)+'" alt="" onerror="this.style.display=\'none\'">':'<div class="news-preview-img-placeholder">📰</div>';
  sheet.innerHTML='<div class="news-preview-handle"></div><div class="news-preview-img-wrap">'+imgHtml+'</div><div class="news-preview-body"><span class="news-preview-tag">'+escHtml(data.tag||data.source||'تقنية')+'</span><div class="news-preview-title">'+escHtml(data.title||data.rawTitle||'')+'</div><div class="news-preview-meta"><span>'+escHtml(data.source||'')+'</span><span class="news-preview-meta-dot"></span><span>'+_fmtRelTime(data.date)+'</span></div><div class="news-preview-content-box"><div class="news-preview-content-header"><span class="ai-sparkle">✦</span><span class="news-preview-content-label">نص الخبر الكامل</span></div><div class="news-fetch-progress active" id="newsFetchProgress"><div class="news-fetch-progress-fill" id="newsFetchFill" style="width:5%"></div></div><div id="newsPreviewContent" class="news-preview-loading"><span class="news-preview-loading-dots"><span class="news-preview-loading-dot"></span><span class="news-preview-loading-dot"></span><span class="news-preview-loading-dot"></span></span> جاري جلب نص الخبر من المصدر...</div></div></div><div class="news-preview-actions"><button class="news-preview-open" onclick="window.open(\''+escJs(data.url||'#')+'\',\'_blank\')">🌐 فتح المصدر الأصلي</button><button class="news-preview-close-btn" onclick="closeNewsPreview()">إغلاق</button></div>';
  document.getElementById('newsPreviewOverlay').classList.add('show');
  _fetchNewsFullText(data);
}
function closeNewsPreview(){ document.getElementById('newsPreviewOverlay').classList.remove('show'); }

var _fetchPct=0, _fetchPctTimer=null;
function _animateFetchPct(target){
  clearInterval(_fetchPctTimer);
  _fetchPctTimer=setInterval(function(){
    var fill=document.getElementById('newsFetchFill'); if(!fill){clearInterval(_fetchPctTimer);return;}
    if(_fetchPct<target){_fetchPct=Math.min(_fetchPct+3,target);fill.style.width=_fetchPct+'%';}
    else clearInterval(_fetchPctTimer);
  },80);
}

function _fetchNewsFullText(data){
  _fetchPct=5; _animateFetchPct(45);
  var hasEn=/[a-zA-Z]/.test(data.rawTitle||'');
  var prompt=hasEn
    ?'أنت صحفي تقني متخصص. مهمتك زيارة رابط الخبر التالي وإعادة كتابته باللغة العربية كاملاً (وليس ملخصاً).\n\nعنوان الخبر: '+String(data.rawTitle||data.title||'')+'\nرابط الخبر: '+String(data.url||'')+'\nالوصف المتوفر: '+String(data.rawDesc||'')+'\n\nاكتب الخبر كاملاً مع كل الأرقام والتفاصيل التقنية. لا Markdown. عربي فقط.'
    :'أنت صحفي تقني. زُر رابط الخبر التالي وأعِد كتابته باللغة العربية كاملاً مع كل التفاصيل.\n\nعنوان: '+String(data.title||'')+'\nرابط: '+String(data.url||'')+'\n\nلا Markdown. لا ملخص، الخبر كاملاً.';
  _animateFetchPct(75);
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':'YOUR_ANTHROPIC_API_KEY','anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:prompt}]})})
  .then(function(r){return r.json();})
  .then(function(j){
    _animateFetchPct(100);
    var text=(j.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('').trim();
    setTimeout(function(){
      var contentEl=document.getElementById('newsPreviewContent'),progressEl=document.getElementById('newsFetchProgress');
      if(progressEl)progressEl.classList.remove('active');
      if(contentEl){contentEl.className='news-preview-content-text';contentEl.textContent=text||data.desc||data.rawDesc||'افتح المصدر الأصلي لقراءة الخبر كاملاً.';}
    },300);
  })
  .catch(function(){
    var contentEl=document.getElementById('newsPreviewContent'),progressEl=document.getElementById('newsFetchProgress');
    if(progressEl)progressEl.classList.remove('active');
    if(contentEl){contentEl.className='news-preview-content-text';contentEl.textContent=data.desc||data.rawDesc||'افتح المصدر الأصلي لقراءة الخبر.';}
  });
}

function renderPublicNewsCards(){
  if(state.current===AppState.UNLOCKED) return;
  initializeDynamicNewsBoard().catch(function(e){
    console.error('News board error:',e);
    if(state.current!==AppState.UNLOCKED){
      var nc=document.getElementById('newsContainer');
      if(nc) nc.innerHTML='<div style="padding:20px;color:var(--do-text-muted);text-align:center;font-family:Cairo,sans-serif;font-size:12px;direction:rtl">⚠️ تعذر تحميل الأخبار.</div>';
    }
  });
}

// تحديث كل 15 دقيقة
setInterval(function(){ if(state.current!==AppState.UNLOCKED) renderPublicNewsCards(); },900000);

  setTimeout(function(){ initPlyrIn(document); processSocialEmbeds(); },350);
