<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ar">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Google</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Plus+Jakarta+Sans:400,500,600,700"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"/>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script async src="https://www.instagram.com/embed.js"></script>

<style type="text/css">

/* ═══ BASE ═══ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
body{color:#6c7982;font-family:'Plus Jakarta Sans','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:13px;background:#252836;overscroll-behavior:none}
div{margin:0;padding:0} img{border:none} textarea,input{font-family:inherit} a{color:#00bdf4;text-decoration:none} a:hover{text-decoration:underline}
.noselect{-webkit-user-select:none;user-select:none}
.valign{display:table;width:100%}.valign-in1{display:table-cell;vertical-align:middle;text-align:center}.valign-in2{display:block}

/* ═══ CHATROLL LAYOUT ═══ */
.group-chat-embedded{position:absolute;inset:0;width:100%;height:100%;background:#252836}
.chat-wrapper{position:absolute;left:0;width:100%;top:0;bottom:36px;font-size:14px;line-height:normal;background:#0d0d0e;border-radius:0}
.chat-top{position:absolute;top:0;left:0;right:0;height:36px;background:#0d0d0e}
.chat-name{position:absolute;top:8px;left:10px;right:10px;height:27px;color:#fff;font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden}
.chat-messages-container{position:absolute;top:36px;left:5px;right:132px;bottom:68px;overflow-y:scroll;overflow-x:hidden;background:#252836;scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.4) rgba(128,128,128,.05)}
.chat-messages-container::-webkit-scrollbar{width:11px;background:rgba(128,128,128,.05)}
.chat-messages-container::-webkit-scrollbar-thumb{border-radius:8px;border:2px solid transparent;background-clip:content-box;background-color:rgba(128,128,128,.4)}
.chat-messages{padding-bottom:2px}
.chat-contacts-container{position:absolute;right:5px;width:125px;top:36px;bottom:92px;overflow-x:hidden;overflow-y:auto;background:#252836}
.chat-contacts{padding:6px}
.chat-contacts-divider{position:absolute;top:36px;bottom:68px;right:130px;width:2px;background:#0d0d0e}
.chat-contacts-banner{position:absolute;bottom:68px;height:24px;right:5px;width:125px;background:#252836}
.chat-online-count{position:absolute;top:6px;left:8px;font-size:12px;font-weight:700;color:#91cc00}
.chat-input-container{position:absolute;bottom:0;height:68px;left:0;right:0;background:#0d0d0e}
.chat-input-wrapper{position:absolute;top:10px;bottom:10px;left:10px;right:10px}
.chat-input,.chat-textarea{position:absolute;border-radius:3px;top:0;left:0;width:100%;height:100%;border:0;margin:0;padding:4px;overflow:auto;overflow-x:hidden;font-size:15px;background:#252836;color:#fff;resize:none;outline:none}
.chat-input::placeholder,.chat-textarea::placeholder{color:#8d91a8}
.chat-signin-box{position:absolute;left:5px;right:5px;top:0;bottom:5px;background:#252836}
.signin-box{position:absolute;top:0;left:0;width:100%;height:100%;text-align:center}
.signin-title{display:block;padding:5px 0 6px;font-size:11px;color:#fff;font-weight:700}
.signin-input{font-size:1.1em;padding:2px;vertical-align:middle;width:35%;max-width:150px;background:#fff;color:#000;border:1px solid #cfcfcf;border-radius:2px}
.consent-accept{background:#00a2d9;color:#fff;margin:0;vertical-align:middle;border:none;border-radius:3px;padding:5px 8px;cursor:pointer;font-size:13px;line-height:1.5}
.chat-welcome-message{padding:10px;color:#0d0d0e;font-size:0}
.chat-history-controls{padding:8px 0 6px;text-align:center}
.chat-create-link{display:none!important}
.send-btn,.attach-bar,.sidebar-toggle,.sidebar-backdrop{display:none!important}
#fileInput{display:none!important}

/* ═══ MESSAGES ═══ */
.msg.message{position:relative;display:block;padding:2px 2px 6px;color:#6c7982;line-height:1.4em;min-height:44px}
.msg-avatar{position:absolute;top:4px;left:8px;cursor:pointer;width:38px;height:38px;border-radius:38px;background-size:cover;background-position:center}
.msg-body{position:relative;min-width:0;padding-left:50px;padding-right:4px;padding-top:6px;min-height:35px;max-width:100%;box-sizing:border-box;overflow:hidden}
.msg-date-line{padding-bottom:2px;font-size:11px;line-height:1em;color:#aaa}
.msg-content-line{font-size:14px;color:#fff;line-height:1.4em;word-break:break-word;overflow-wrap:anywhere;unicode-bidi:plaintext}
.msg-inline-name{font-weight:700;cursor:pointer;color:#fff}
.msg-inline-type{font-size:.77em;color:#fff;font-weight:400}
.msg-colon{color:#fff;margin:0}
.msg-text{font-size:14px;color:#fff;line-height:1.4em;display:inline;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.msg-text a{color:#00bdf4}
.emoji-char{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji','Twemoji Mozilla',sans-serif !important;font-style:normal;display:inline}
.msg-edited{font-size:10px;color:#aaa;margin-left:4px;font-style:italic}
.msg-actions{position:absolute;right:0;top:2px;display:flex;opacity:0;pointer-events:none;z-index:5}
.msg:hover .msg-actions{opacity:1;pointer-events:auto}
.msg-action-btn{width:20px;height:20px;padding:0;background:transparent;border:none;color:#aaa;cursor:pointer}
.msg-action-btn:hover{color:#fff}
.msg-action-btn svg{width:16px;height:16px}
.msg-media-wrap{display:block;margin-top:6px;max-width:100%;overflow:hidden}
.msg-image{max-width:min(100%,520px);max-height:70vh;object-fit:contain;cursor:zoom-in;border:none}
.msg-file-link{display:inline-flex;max-width:min(100%,520px);background:#2a2d3e;border-radius:3px;padding:6px 8px;color:#a0a4bf;font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.08)}
.msg-file-icon{margin-left:6px}
.msg-file-info{display:flex;flex-direction:column;min-width:0}
.msg-file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8e9f0;font-size:12px}
.msg-file-size{font-size:10px;color:#8a8fac}
.msg-file-hint{font-size:10px;color:#8a8fac;margin-top:2px}
.msg.selected-message{background:rgba(110,142,251,.16)!important;outline:1px solid rgba(110,142,251,.5)}
.msg.reply-highlight{background:rgba(145,204,0,.12)!important}

/* ═══ PRESENCE / CONTACTS ═══ */
.contact-list-item{position:relative;width:100%;height:24px}
.contact-list-profile-image,.presence-avatar{position:absolute;top:0;left:0;cursor:pointer;width:20px;height:20px;border-radius:20px;background-size:cover;background-position:center}
.contact-list-profile-name,.presence-name{padding:2px 0 0 26px;font-size:13px;white-space:nowrap;overflow:hidden;cursor:pointer;color:#fff;font-weight:400}
.contact-list-status-icon,.presence-dot{position:absolute;top:8px;right:2px;width:6px;height:6px;border-radius:6px;background:#5bc80b}
.presence-name.anon{font-style:italic;opacity:.5}
.presence-name.viewer-count{color:#91cc00;font-weight:700;font-style:normal;opacity:1}

/* ═══ FOOTER BUTTONS ═══ */
.chat-footer-attach-button,.chat-footer-gif-button,.chat-footer-mic-button,.chat-footer-logout-button,.chat-footer-clear-button{display:none!important;position:absolute!important;bottom:8px!important;align-items:center;justify-content:center;color:#6c7982!important;cursor:pointer;z-index:60!important;text-decoration:none!important}
.chat-footer-attach-button,.chat-footer-mic-button,.chat-footer-logout-button{width:20px!important;height:20px!important}
.chat-footer-attach-button svg,.chat-footer-logout-button svg,.chat-footer-mic-button svg,.chat-footer-clear-button svg{width:14px!important;height:14px!important;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.chat-footer-attach-button{right:120px!important}
.chat-footer-gif-button{right:84px!important;width:24px!important;height:20px!important;font-size:10px!important;font-weight:700!important;border:1px solid #3a3d52!important;border-radius:3px!important;background:#171923!important;letter-spacing:.2px!important;line-height:20px;text-align:center}
.chat-footer-mic-button{right:50px!important;border:1px solid #3a3d52!important;border-radius:3px!important;background:#171923!important;width:22px!important}
.chat-footer-logout-button{right:15px!important}
.chat-footer-clear-button{right:154px!important;width:22px!important;height:20px!important;border:1px solid #3a3d52!important;border-radius:3px!important;background:#171923!important;color:#fca5a5!important}
.chat-footer-attach-button:hover,.chat-footer-gif-button:hover,.chat-footer-mic-button:hover,.chat-footer-logout-button:hover{color:#fff!important;border-color:#5e6278!important;background:#202333!important}
.chat-footer-clear-button:hover{border-color:#7f1d1d!important;background:#2a1518!important}
.chat-footer-mic-button.recording{color:#ff6b6b!important;border-color:#ff6b6b!important;background:#2a1518!important;animation:voicePulse 1s infinite alternate}
@keyframes voicePulse{from{opacity:.75}to{opacity:1}}

body.chat-unlocked .chat-footer-attach-button{display:flex!important}
body.chat-unlocked .chat-footer-gif-button{display:block!important}
body.chat-unlocked .chat-footer-mic-button{display:flex!important}
body.chat-unlocked .chat-footer-logout-button{display:flex!important}
body.chat-unlocked .chat-footer-clear-button.show{display:flex!important}

/* ═══ CHAT LOCKED STATE ═══ */
body.chat-locked .chat-contacts-container,
body.chat-locked .chat-contacts-divider,
body.chat-locked .chat-contacts-banner{display:none!important}
body.chat-locked .chat-messages-container{right:5px!important;bottom:68px!important;top:36px!important}

/* ═══ FIX 2: TYPING BAR — إصلاح كامل ═══ */
.typing-bar{
  display:none;
  position:absolute;
  left:15px;right:142px;
  bottom:70px;
  height:15px;line-height:15px;
  z-index:38;
  background:#252836;
  color:#8a8fac;
  padding:0 2px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:11px;
  pointer-events:none;
  border-top:1px solid transparent;
}
.chat-wrapper.has-typing .typing-bar{display:block;}
.chat-wrapper.has-typing .chat-messages-container{bottom:87px!important;}
body.chat-locked .chat-wrapper.has-typing .chat-messages-container{bottom:68px!important;}
.typing-bar .typing-name{color:#fff;font-weight:700}
.typing-bar .typing-status-word{color:#4c7d9f}

/* ═══ REPLY PREVIEW ═══ */
.chat-reply-preview{display:none;position:absolute;left:5px;right:132px;bottom:68px;min-height:30px;max-height:54px;background:#0d0d0e;border-top:2px solid #252836;color:#fff;z-index:28;padding:5px 32px 5px 10px;overflow:hidden;box-sizing:border-box}
.chat-wrapper.replying .chat-reply-preview{display:block}
.chat-wrapper.replying .chat-messages-container{bottom:98px!important}
.chat-wrapper.replying.has-typing .chat-messages-container{bottom:116px!important}
.chat-reply-preview:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:3px;background:#91cc00;border-radius:2px}
.reply-preview-title{padding-left:10px;font-size:11px;color:#91cc00;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-preview-text{padding-left:10px;padding-top:2px;font-size:12px;color:#dfe3f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-preview-close{position:absolute;top:5px;right:8px;width:20px;height:20px;border:0;background:transparent;color:#8d91a8;cursor:pointer;font-size:18px;padding:0}
.reply-preview-close:hover{color:#fff}
.msg-reply-quote{display:block;margin:0 0 4px;padding:4px 7px 4px 9px;border-left:3px solid #91cc00;background:rgba(13,13,14,.62);color:#cfd3ea;max-width:min(340px,88%);cursor:pointer;overflow:hidden}
.msg-reply-quote:hover{background:rgba(13,13,14,.82)}
.msg-reply-name{display:block;color:#91cc00;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-reply-text{display:block;color:#dfe3f4;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══ UPLOAD PROGRESS ═══ */
.upload-progress-wrap{position:fixed;left:15px;bottom:8px;width:130px;height:20px;z-index:520;background:transparent;border:0;color:#8a8fac;display:none;overflow:hidden}
.upload-progress-wrap[style*="block"]{display:block}
.upload-progress-top{display:flex;align-items:center;justify-content:space-between;gap:5px;height:11px;line-height:11px}
.upload-progress-label{font-size:9px;color:#8a8fac;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-progress-pct{font-size:9px;color:#91cc00;font-weight:700}
.upload-progress-bar{height:3px;margin-top:3px;background:#252836;border-radius:3px;overflow:hidden}
.upload-progress-fill{height:100%;width:0%;background:#91cc00;border-radius:3px;transition:width .18s linear}

/* ═══ UPLOAD PREVIEW ═══ */
.upload-preview-bar[style*="flex"]{display:flex!important;position:fixed;left:10px;right:142px;bottom:116px;z-index:410;background:#0d0d0e;border:1px solid #2a2d3e;border-radius:6px;padding:6px;gap:6px;flex-wrap:wrap}
.preview-item{position:relative;display:inline-flex}
.preview-thumb{width:46px;height:46px;object-fit:cover;border-radius:4px}
.preview-file-chip{background:#252836;color:#d7dbea;border-radius:4px;padding:6px 8px;font-size:11px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-remove{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:0;background:#e53e3e;color:#fff;font-size:10px;cursor:pointer}

/* ═══ IOS UPLOAD NOTE ═══ */
.ios-upload-note{position:fixed;left:10px;right:142px;bottom:92px;z-index:430;background:#11131d;border:1px solid #2a2d3e;color:#cbd5e1;border-radius:6px;padding:7px 9px;font-size:11px;line-height:1.35;display:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.ios-upload-note.show{display:block}

/* ═══ PLYR VIDEO ═══ */
.plyr-video-wrap{width:min(520px,100%);max-width:100%;margin-top:6px;background:#05060a;border:1px solid rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.plyr-video-wrap video{width:100%;max-height:70vh;background:#000;display:block}
.plyr-video-wrap .plyr{--plyr-color-main:#6e8efb;--plyr-video-background:#000;--plyr-control-radius:4px;--plyr-control-icon-size:15px;--plyr-control-spacing:8px;--plyr-video-controls-background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.76));width:100%;max-width:100%}
.plyr-video-wrap .plyr__controls{direction:ltr!important;padding:8px}
.plyr-video-wrap .plyr__control--overlaid{background:#6e8efb;color:#fff}
.plyr-video-fallback{margin-top:6px;background:#11131d;border:1px solid rgba(255,255,255,.10);border-radius:6px;padding:9px;color:#d7dbea;font-size:12px;line-height:1.55}
.plyr-video-fallback a{display:none!important}
.video-needs-conversion-card{display:block;max-width:min(330px,100%);background:#11131d;border:1px solid rgba(255,255,255,.10);border-radius:6px;padding:10px;margin-top:6px;color:#d7dbea;font-size:12px;line-height:1.55}
.video-needs-conversion-card .vc-title{font-weight:700;color:#facc15;margin-bottom:3px}
.video-needs-conversion-card .vc-name{color:#a0a4bf;word-break:break-word;margin-top:3px}
.video-needs-conversion-card a{display:none!important}

/* ═══ PLYR AUDIO ═══ */
.plyr-audio-wrap{max-width:min(300px,100%);margin-top:6px;background:#11131d;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:6px}
.plyr-audio-wrap .plyr{--plyr-color-main:#6e8efb;--plyr-audio-controls-background:#11131d;--plyr-audio-control-color:#e8e9f0;--plyr-control-radius:4px;--plyr-control-icon-size:15px;--plyr-control-spacing:8px}
.plyr-audio-wrap .plyr__controls{padding:4px!important;background:#11131d!important;color:#e8e9f0!important}
.plyr-audio-wrap .plyr__controls [data-plyr="mute"],.plyr-audio-wrap .plyr__controls .plyr__volume{display:none!important}

/* ═══ FIX 3: MSG CONTEXT MENU — تصميم جديد ═══ */
.attach-choice-menu,.msg-context-menu{position:fixed;z-index:500;display:none;background:#11131d;border:1px solid #2f3247;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);overflow:hidden;color:#e8e9f0;font-family:inherit;min-width:190px;direction:rtl}
.attach-choice-menu.show,.msg-context-menu.show{display:block}
.attach-choice-menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:#e8e9f0;text-align:right;padding:10px 14px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;direction:rtl}
.ctx-section{padding:4px 0}
.ctx-sep{height:1px;background:rgba(255,255,255,.08);margin:2px 0}
.ctx-btn{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:#e8e9f0;text-align:right;padding:10px 14px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;direction:rtl;transition:background .1s}
.ctx-btn:hover{background:#1e2030}
.ctx-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;line-height:1}
.ctx-label{flex:1;text-align:right}
.ctx-btn.reply-action{color:#91cc00;font-weight:700}
.ctx-btn.reply-action:hover{background:rgba(145,204,0,.08)}
.ctx-btn.danger{color:#fca5a5}
.ctx-btn.danger:hover{background:#2a1518}
.ctx-divider-label{padding:4px 14px 3px;font-size:9px;color:#4a4f68;font-weight:700;letter-spacing:.5px;text-align:right;direction:rtl}
.attach-choice-menu button:hover{background:#252836;color:#fff}

/* ═══ EDIT WRAP ═══ */
.msg-edit-wrap{display:block;margin:6px 0 2px;background:#141722;border:1px solid #333650;border-radius:8px;padding:8px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.msg-edit-input{width:100%;min-height:70px;resize:vertical;background:#252836;color:#fff;border:1px solid #4a4f68;border-radius:6px;padding:8px 10px;font:14px/1.5 inherit;outline:none;box-sizing:border-box}
.msg-edit-input:focus{border-color:#6e8efb;box-shadow:0 0 0 2px rgba(110,142,251,.18)}
.msg-edit-btns{display:flex;gap:7px;margin-top:7px;justify-content:flex-end}
.msg-edit-save,.msg-edit-cancel{border:0;border-radius:5px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer}
.msg-edit-save{background:#6e8efb;color:#fff}
.msg-edit-cancel{background:#2f3247;color:#cfd3ea}

/* ═══ LIGHTBOX ═══ */
.lightbox{position:fixed;inset:0;background:rgba(13,13,14,.94);z-index:200;display:none;align-items:center;justify-content:center;padding:12px;overflow:hidden;touch-action:none}
.lightbox.open{display:flex}
.lightbox-viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;cursor:grab}
.lightbox img{max-width:92vw;max-height:88dvh;border-radius:8px;border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 64px rgba(0,0,0,.8);object-fit:contain;user-select:none;-webkit-user-drag:none;touch-action:none;transform:translate3d(0,0,0) scale(1);transform-origin:center center;transition:transform .08s linear;will-change:transform}
.lightbox-close{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;z-index:205;font-size:22px}
.lightbox-toolbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 8px;z-index:205}
.lightbox-zoom-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:18px}
.lightbox-reset-btn{width:auto;min-width:54px;border-radius:999px;font-size:12px;padding:0 12px}
.lightbox-zoom-level{min-width:46px;text-align:center;color:#dfe3f4;font-size:12px}

/* ═══ TOAST ═══ */

function initPlyrIn(root){if(!root||!window.Plyr){setTimeout(function(){if(window.Plyr)initPlyrIn(root);},300);return;}(root.querySelectorAll?root.querySelectorAll('video.plyr-video:not([data-plyr-ready])'):[] ).forEach(function(v){try{v.setAttribute('data-plyr-ready','1');new Plyr(v,{controls:['play-large','play','progress','current-time','duration','mute','volume','settings','fullscreen'],settings:['speed'],fullscreen:{enabled:true,iosNative:true},clickToPlay:true,hideControls:true});}catch(e){}});(root.querySelectorAll?root.querySelectorAll('audio.plyr-audio:not([data-plyr-ready])'):[] ).forEach(function(a){try{a.setAttribute('data-plyr-ready','1');a.setAttribute('controlsList','nodownload');a.addEventListener('contextmenu',function(e){e.preventDefault();});new Plyr(a,{controls:['play','progress','current-time','duration'],settings:[],keyboard:{focused:true,global:false}});}catch(e){}});}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function scrollToBottom(){var w=document.getElementById('messagesWrap');setTimeout(function(){w.scrollTop=w.scrollHeight;},60);}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function updateSendBtn(){if(isSending)return;var hasText=document.getElementById('chatInput').value.trim().length>0;var hasFiles=pendingFiles.some(function(f){return f!=null;});var btn=document.getElementById('sendBtn');if(btn)btn.disabled=!(hasText||hasFiles);}
function formatTime(d){return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true});}
function escHtml(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escJs(str){return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}
function linkify(text){return text.replace(/(https?:\/\/[^\s<>"]+)/g,'<a target="_blank" rel="nofollow" href="$1">$1</a>');}
function renderEmoji(text){if(!text)return text;return text.replace(/([\uD83C-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]|[\u1F000-\u1F02F])/g,function(m){return'<span class="emoji-char">'+m+'</span>';});}
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3500);}
function showIOSUploadNote(msg){var el=document.getElementById('iosUploadNote');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(showIOSUploadNote._t);showIOSUploadNote._t=setTimeout(function(){el.classList.remove('show');},6500);}

/* ══════════════════════════════════════════
   DEVICE ID
══════════════════════════════════════════ */
function getDeviceId(){var saved=localStorage.getItem('__chatDeviceId');if(saved)return Promise.resolve(saved);try{var canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.textBaseline='top';ctx.font='14px Plus Jakarta Sans';ctx.fillStyle='#f60';ctx.fillRect(125,1,62,20);ctx.fillStyle='#069';ctx.fillText('fp',2,2);var raw=canvas.toDataURL()+navigator.userAgent+screen.width+screen.height;return crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)).then(function(buf){var id='dev_'+Array.from(new Uint8Array(buf)).map(function(b){return b.toString(36);}).join('').substr(0,18);localStorage.setItem('__chatDeviceId',id);return id;});}catch(e){var id='dev_'+Date.now().toString(36)+Math.random().toString(36).substr(2,6);localStorage.setItem('__chatDeviceId',id);return Promise.resolve(id);}}

/* ══════════════════════════════════════════
   ACCESS CONTROL
══════════════════════════════════════════ */
function isPrivilegedChatName(name){var n=String(name||'').trim().toLowerCase();return n==='t'||n==='h';}
function hasVerifiedAccessForName(name){try{return sessionStorage.getItem('__chatAccessGranted')==='yes'&&sessionStorage.getItem('__chatAccessName')===String(name||'').trim();}catch(e){return false;}}
function setVerifiedAccessForName(name){try{sessionStorage.setItem('__chatAccessGranted','yes');sessionStorage.setItem('__chatAccessName',String(name||'').trim());}catch(e){}}
function showAccessCodeDialog(){return new Promise(function(resolve){var overlay=document.getElementById('accessCodeOverlay'),input=document.getElementById('accessCodeInput');var err=document.getElementById('accessCodeError'),ok=document.getElementById('accessCodeOkBtn'),cancel=document.getElementById('accessCodeCancelBtn');if(!overlay||!input||!ok||!cancel){resolve(false);return;}function cleanup(result){overlay.classList.remove('show');ok.removeEventListener('click',onOk);cancel.removeEventListener('click',onCancel);input.removeEventListener('keydown',onKey);resolve(result);}function onOk(){if(String(input.value||'').trim()===CHAT_ACCESS_CODE){cleanup(true);}else{if(err)err.style.display='block';input.select();}}function onCancel(){cleanup(false);}function onKey(e){if(e.key==='Enter')onOk();else if(e.key==='Escape')onCancel();}input.value='';if(err)err.style.display='none';overlay.classList.add('show');ok.addEventListener('click',onOk);cancel.addEventListener('click',onCancel);input.addEventListener('keydown',onKey);setTimeout(function(){input.focus();},40);});}
function requireChatAccess(name){if(isPrivilegedChatName(name)||hasVerifiedAccessForName(name))return Promise.resolve(true);return showAccessCodeDialog().then(function(ok){if(ok){setVerifiedAccessForName(name);return true;}showToast('رمز التحقق غير صحيح.','error');return false;});}

/* ══════════════════════════════════════════
   SESSION (5 دقائق)
══════════════════════════════════════════ */
var CHAT_INACTIVITY_MS=5*60*1000;
function markActive(){var t=Date.now();try{sessionStorage.setItem('__chatLastActiveAt',t);localStorage.setItem('__chatLastActiveAt',t);}catch(e){}}
function markAway(){var t=Date.now();try{sessionStorage.setItem('__chatAwayAt',t);localStorage.setItem('__chatAwayAt',t);}catch(e){}}
function sessionExpired(){var a=parseInt(localStorage.getItem('__chatAwayAt')||0,10);var last=parseInt(localStorage.getItem('__chatLastActiveAt')||0,10);var base=Math.max(a,last);if(!base)return false;return Date.now()-base>=CHAT_INACTIVITY_MS;}
['click','keydown','touchstart','pointerdown'].forEach(function(ev){document.addEventListener(ev,function(){if(document.body.classList.contains('chat-unlocked'))markActive();},{passive:true});});
document.addEventListener('visibilitychange',function(){if(document.hidden){markAway();}else{if(sessionExpired()&&(isSignedIn||document.body.classList.contains('chat-unlocked'))){try{localStorage.removeItem('__chatUserName');sessionStorage.removeItem('__chatAccessGranted');sessionStorage.removeItem('__chatAccessName');}catch(e){}forceReturnToLogin();}else if(document.body.classList.contains('chat-unlocked')){markActive();}}});
window.addEventListener('pagehide',markAway);

/* ══════════════════════════════════════════
   ADMIN
══════════════════════════════════════════ */
function isAdminUser(){return !!(currentUser&&String(currentUser.name||'').trim()===ADMIN_NAME);}
function updateAdminControls(){var btn=document.getElementById('adminClearFooterBtn'),show=isAdminUser();if(btn){if(show)btn.classList.add('show');else btn.classList.remove('show');}}
function deleteAllMessages(){if(!isAdminUser()){showToast('هذا الزر للمسؤول فقط','error');return;}if(!confirm('حذف جميع الرسائل؟'))return;var ref=db.collection('rooms').doc(ROOM_ID).collection('messages');function deleteBatch(){return ref.limit(250).get().then(function(snap){if(snap.empty)return;var batch=db.batch();snap.docs.forEach(function(doc){batch.delete(doc.ref);});return batch.commit().then(deleteBatch);});}deleteBatch().then(function(){showToast('تم حذف جميع الرسائل','success');}).catch(function(){showToast('فشل الحذف','error');});}

/* ══════════════════════════════════════════
   LOGOUT / FORCE RETURN
══════════════════════════════════════════ */
function logoutUser(){var devId=currentUser&&currentUser.deviceId;var cleanup=devId?Promise.all([rtdb.ref('presence/'+ROOM_ID+'/'+devId).remove().catch(function(){}),rtdb.ref('typing/'+ROOM_ID+'/'+devId).remove().catch(function(){})]):Promise.resolve();cleanup.then(function(){try{if(unsubMessages)unsubMessages();}catch(e){}try{localStorage.removeItem('__chatUserName');sessionStorage.removeItem('__chatAccessGranted');sessionStorage.removeItem('__chatAccessName');}catch(e){}try{auth.signOut();}catch(e){}location.reload();});}
function forceReturnToLogin(){document.body.classList.add('chat-locked');document.body.classList.remove('chat-unlocked');try{if(unsubMessages)unsubMessages();}catch(e){}unsubMessages=null;isSignedIn=false;isChatUnlocked=false;try{localStorage.removeItem('__chatUserName');}catch(e){}try{if(currentUser&&currentUser.deviceId){rtdb.ref('presence/'+ROOM_ID+'/'+currentUser.deviceId).remove().catch(function(){});rtdb.ref('typing/'+ROOM_ID+'/'+currentUser.deviceId).remove().catch(function(){});}}catch(e){}currentUser=null;var sign=document.getElementById('signinOverlay'),bottom=document.getElementById('chatBottom'),nameInput=document.getElementById('nameInput');if(bottom)bottom.style.display='none';if(sign)sign.style.display='flex';if(nameInput)nameInput.value='';updateAdminControls();registerAnonymousPresence();renderPublicNewsCards();setTimeout(function(){if(nameInput)nameInput.focus();},150);}

/* ══════════════════════════════════════════
   SIGN IN
══════════════════════════════════════════ */
document.getElementById('signinBtn').addEventListener('click',function(){userConsented=true;localStorage.setItem('__chatConsent','yes');doSignIn();});
document.getElementById('nameInput').addEventListener('keydown',function(e){if(e.key==='Enter'){userConsented=true;localStorage.setItem('__chatConsent','yes');doSignIn();}});
function doSignIn(){var name=document.getElementById('nameInput').value.trim();if(!name){document.getElementById('nameInput').focus();return;}var btn=document.getElementById('signinBtn');btn.disabled=true;btn.textContent='...';getDeviceId().then(function(devId){var authP=auth.currentUser?Promise.resolve(auth.currentUser):auth.signInAnonymously().then(function(r){return r.user;});return authP.then(function(){var ref=db.collection('users').doc(devId);return ref.get().then(function(snap){var payload={name:name,deviceId:devId,lastSeen:firebase.firestore.FieldValue.serverTimestamp()};return snap.exists?ref.update(payload):ref.set(Object.assign(payload,{created:firebase.firestore.FieldValue.serverTimestamp()}));}).then(function(){return devId;});});}).then(function(devId){return requireChatAccess(name).then(function(ok){if(!ok){btn.disabled=false;btn.textContent='Sign in';renderPublicNewsCards();return;}localStorage.setItem('__chatUserName',name);autoSignIn(name,devId);});}).catch(function(e){var msg='حدث خطأ، حاول مرة أخرى';if(e&&e.code==='auth/admin-restricted-operation')msg='فعّل Anonymous sign-in من Firebase';showToast(msg,'error');btn.disabled=false;btn.textContent='Sign in';});}
function autoSignIn(name,devId){currentUser={name:name,deviceId:devId};isSignedIn=true;document.getElementById('signinOverlay').style.display='none';document.getElementById('chatBottom').style.display='block';updateAdminControls();registerNamedPresence(name,devId);unlockChatView();markActive();setTimeout(function(){document.getElementById('chatInput').focus();},300);}

   INIT
══════════════════════════════════════════ */
(function init(){var savedName=localStorage.getItem('__chatUserName');var authP=auth.currentUser?Promise.resolve(auth.currentUser):auth.signInAnonymously().then(function(r){return r.user;});authP.then(function(){renderPublicNewsCards();if(!savedName){registerAnonymousPresence();setTimeout(function(){var inp=document.getElementById('nameInput');if(inp)inp.focus();},300);return;}userConsented=true;getDeviceId().then(function(devId){requireChatAccess(savedName).then(function(ok){if(ok)autoSignIn(savedName,devId);else{try{localStorage.removeItem('__chatUserName');}catch(e){}renderPublicNewsCards();}});});}).catch(function(e){console.error('Init error:',e);showToast('تعذر تحميل الرسائل','error');registerAnonymousPresence();});})();

/* ══════════════════════════════════════════
   CHAT VIEW
══════════════════════════════════════════ */
function unlockChatView(){isChatUnlocked=true;document.body.classList.remove('chat-locked');document.body.classList.add('chat-unlocked');clearChatMessagesDom();subscribeMessages();}
function clearChatMessagesDom(){var cm=document.getElementById('chatMessages');if(!cm)return;cm.innerHTML='<div class="chat-history-controls" style="display:none;"><a class="chat-history-load" href="javascript:void(0)">Load Earlier Messages</a></div><div class="chat-welcome-message"></div>';}
function subscribeMessages(){if(!isChatUnlocked){renderPublicNewsCards();return;}if(unsubMessages)unsubMessages();unsubMessages=db.collection('rooms').doc(ROOM_ID).collection('messages').orderBy('timestamp','asc').onSnapshot(function(snap){snap.docChanges().forEach(function(ch){if(ch.type==='added')renderMessage(ch.doc.id,ch.doc.data(),true);else if(ch.type==='modified')updateMsgEl(ch.doc.id,ch.doc.data());else if(ch.type==='removed')removeMsgEl(ch.doc.id);});});}

/* ══════════════════════════════════════════
   MESSAGE RENDERING
══════════════════════════════════════════ */
function renderMessage(id,data,scrollDown){if(!isChatUnlocked)return;if(document.getElementById('msg-'+id))return;var el=buildMsgEl(id,data);var w=document.querySelector('.chat-welcome-message');if(w)document.getElementById('chatMessages').insertBefore(el,w);else document.getElementById('chatMessages').appendChild(el);if(scrollDown)scrollToBottom();setTimeout(function(){initPlyrIn(el);},80);}
function buildMsgEl(id,data){
  var isOwn=currentUser&&data.deviceId===currentUser.deviceId;
  var ts=data.timestamp?(data.timestamp.toDate?data.timestamp.toDate():new Date(data.timestamp)):new Date();
  var el=document.createElement('div');el.className='msg message';el.id='msg-'+id;el.dataset.id=id;
  var displayText=normalizeEmojiPresentation(data.text||'');var displayHtml=renderEmoji(linkify(escHtml(displayText)));
  var socialEmbedHtml=buildSocialEmbedsHtml(data.text||'');
  el.addEventListener('click',function(e){var tag=(e.target&&e.target.tagName||'').toLowerCase();if(tag==='a'||tag==='button'||tag==='textarea'||tag==='input'||tag==='video'||tag==='iframe'||(e.target.closest&&e.target.closest('.msg-edit-wrap,.msg-reply-quote')))return;openMessageMenu(id,isOwn,data,e.clientX||20,e.clientY||20);});
  el.addEventListener('contextmenu',function(e){e.preventDefault();openMessageMenu(id,isOwn,data,e.clientX||20,e.clientY||20);});
  var mediaHtml='';
  var atts=data.attachments;
  if(atts&&Array.isArray(atts)&&atts.length){mediaHtml='<div class="msg-media-wrap">';atts.forEach(function(att){if(!att)return;var t=att.type||detectFileType(att.mime,att.name);var primaryUrl=att.fullUrl||att.cdnUrl||att.url||att.directUrl||'';if(att.provider==='uploadcare')primaryUrl=normalizeUploadcareUrl(primaryUrl,att.name);if(t==='image'){var imgUrls=getImageUrlCandidates(Object.assign({},att,{url:primaryUrl}));var first=imgUrls[0]||primaryUrl;var enc=encodeURIComponent(JSON.stringify(imgUrls));mediaHtml+='<img class="msg-image" src="'+escHtml(first)+'" data-fallback-idx="0" data-fallbacks="'+escHtml(enc)+'" alt="'+escHtml(att.name||'صورة')+'" onerror="handleImageError(this)" onclick="event.stopPropagation();openLightbox(this.src)"/>';}else if(t==='video'){if(isMovOrProblemVideo(att)){mediaHtml+='<div class="video-needs-conversion-card"><div class="vc-title">الفيديو يحتاج تحويلًا</div><div>هذا الفيديو بصيغة قد لا تعمل داخل المتصفح.</div><div class="vc-name">'+escHtml(att.name||'video')+'</div></div>';}else if(primaryUrl){var vs=buildVideoSources(att,primaryUrl);mediaHtml+='<div class="plyr-video-wrap"><video class="plyr-video" controls playsinline webkit-playsinline preload="metadata" crossorigin="anonymous" onerror="handlePlyrVideoError(this)">'+vs.html+'متصفحك لا يدعم تشغيل هذا الفيديو.</video></div>';}else{var fid=getAttachmentFileId(att);if(fid)mediaHtml+='<div class="social-embed-card"><iframe class="social-embed-frame social-embed-youtube" src="https://drive.google.com/file/d/'+encodeURIComponent(fid)+'/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>';}}else if(t==='audio'){var audioUrl=primaryUrl||att.url||'';var audioMime=att.mime||inferMimeFromName(att.name||'','audio/mpeg');var audioSources='<source src="'+escHtml(audioUrl)+'" type="'+escHtml(audioMime)+'">';if(audioMime.indexOf('webm')>=0){var mp4Url=audioUrl.replace(/\.webm$/i,'.mp4').replace(/\.ogg$/i,'.mp4');audioSources+='<source src="'+escHtml(mp4Url)+'" type="audio/mp4">';}if(audioMime.indexOf('mp4')>=0){var webmUrl=audioUrl.replace(/\.m4a$/i,'.webm').replace(/\.mp4$/i,'.webm');audioSources+='<source src="'+escHtml(webmUrl)+'" type="audio/webm">';}mediaHtml+='<div class="plyr-audio-wrap"><audio class="plyr-audio" controls preload="metadata" controlsList="nodownload" oncontextmenu="return false">'+audioSources+'</audio></div>';}else{var icon=getFileIcon(att.name,att.mime),size=att.size?formatFileSize(att.size):'';mediaHtml+='<a class="msg-file-link" href="'+escHtml(att.driveUrl||primaryUrl||att.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"><span class="msg-file-icon">'+icon+'</span><span class="msg-file-info"><span class="msg-file-name">'+escHtml(att.name||'ملف')+'</span>'+(size?'<span class="msg-file-size">'+size+'</span>':'')+'<span class="msg-file-hint">فتح / تحميل</span></span></a>';}});mediaHtml+='</div>';}
  var editedBadge=data.edited?'<span class="msg-edited">(edited)</span>':'';
  var replyQuoteHtml=buildReplyQuoteHtml(data.replyTo);
  el.innerHTML='<div class="msg-avatar" style="background-image:url(\''+DEFAULT_AVATAR+'\')"></div><div class="msg-body"><div class="msg-date-line">'+escHtml(formatTime(ts))+'</div>'+replyQuoteHtml+'<div class="msg-content-line"><span class="msg-inline-name">'+escHtml(data.name||'Unknown')+'</span> <span class="msg-inline-type">('+escHtml(data.type||'Guest')+')</span><span class="msg-colon">:</span><span class="msg-text" id="txt-'+id+'" data-raw="'+escHtml(data.text||'')+'">'+displayHtml+'</span>'+editedBadge+'</div>'+socialEmbedHtml+mediaHtml+'</div>';
  setTimeout(function(){initPlyrIn(el);processSocialEmbeds();},120);
  return el;
}
function updateMsgEl(id,data){var el=document.getElementById('msg-'+id);if(!el)return;var next=buildMsgEl(id,data);el.parentNode.replaceChild(next,el);setTimeout(function(){initPlyrIn(next);processSocialEmbeds();},120);}
function removeMsgEl(id){var el=document.getElementById('msg-'+id);if(el)el.remove();}

/* ══════════════════════════════════════════
   FIX 3: MESSAGE MENU — تصميم جديد كامل
══════════════════════════════════════════ */
function openMessageMenu(id,isOwn,data,x,y){
  var menu=document.getElementById('msgContextMenu');if(!menu)return;
  var hasText=!!(data.text&&data.text.trim());

  var html='<div class="ctx-section">';
  html+='<button type="button" class="ctx-btn reply-action" onclick="replyToMsg(\''+id+'\')"><span class="ctx-icon">↩</span><span class="ctx-label">رد على الرسالة</span></button>';
  if(hasText){
    html+='<button type="button" class="ctx-btn" onclick="copyMsg(\''+id+'\')"><span class="ctx-icon">📋</span><span class="ctx-label">نسخ الرسالة</span></button>';
  }
  html+='<button type="button" class="ctx-btn" onclick="toggleSelectMessage(\''+id+'\')"><span class="ctx-icon">☑️</span><span class="ctx-label">تحديد الرسالة</span></button>';
  html+='</div>';

  var canEdit=isOwn&&hasText;
  var canDelete=isOwn||isAdminUser();
  if(canEdit||canDelete){
    html+='<div class="ctx-sep"></div>';
    html+='<div class="ctx-divider-label">إجراءات</div>';
    html+='<div class="ctx-section">';
    if(canEdit){
      html+='<button type="button" class="ctx-btn" onclick="startEdit(\''+id+'\')"><span class="ctx-icon">✏️</span><span class="ctx-label">تعديل الرسالة</span></button>';
    }
    if(canDelete){
      html+='<button type="button" class="ctx-btn danger" onclick="deleteMsg(\''+id+'\')"><span class="ctx-icon">🗑️</span><span class="ctx-label">حذف الرسالة</span></button>';
    }
    html+='</div>';
  }

  menu.innerHTML=html;menu.classList.add('show');

  var mw=200,mh=menu.querySelectorAll('.ctx-btn').length*44+20;
  var left=Math.min(Math.max(x,8),window.innerWidth-mw-8);
  var top=Math.min(Math.max(y,8),window.innerHeight-mh-8);
  menu.style.left=left+'px';menu.style.top=top+'px';
  setTimeout(function(){document.addEventListener('click',closeMessageMenuOnce,{once:true});},0);
}
function closeMessageMenuOnce(e){var m=document.getElementById('msgContextMenu');if(m&&(!e||!m.contains(e.target)))m.classList.remove('show');}
function getMsgRawText(id){var txtEl=document.getElementById('txt-'+id);return txtEl?(txtEl.dataset.raw||txtEl.textContent||''):'';}
function copyMsg(id){var t=getMsgRawText(id);if(!t)return;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){showToast('تم النسخ','success');}).catch(function(){showToast('تعذر النسخ','error');});}

/* ══════════════════════════════════════════
   REPLY
══════════════════════════════════════════ */
function replyToMsg(id){closeMessageMenuOnce();var el=document.getElementById('msg-'+id);var name=el&&el.querySelector('.msg-inline-name')?el.querySelector('.msg-inline-name').textContent:'Unknown';var text=getMsgRawText(id);var summary=text?text:(el&&el.querySelector('.msg-media-wrap')?'مرفق':'رسالة');summary=String(summary||'رسالة').replace(/\s+/g,' ').trim();if(summary.length>140)summary=summary.slice(0,137)+'...';pendingReply={id:id,name:name,text:summary,ts:Date.now()};renderReplyPreview();var input=document.getElementById('chatInput');if(input)input.focus();}
function buildReplyQuoteHtml(reply){if(!reply||!reply.id)return'';var name=reply.name||'Unknown',text=String(reply.text||'رسالة').replace(/\s+/g,' ').trim();if(text.length>130)text=text.slice(0,127)+'...';return'<div class="msg-reply-quote" onclick="event.stopPropagation();scrollToReplyTarget(\''+escJs(reply.id)+'\')"><span class="msg-reply-name">'+escHtml(name)+'</span><span class="msg-reply-text">'+escHtml(text)+'</span></div>';}
function renderReplyPreview(){var bar=document.getElementById('replyPreview'),wrapper=document.querySelector('.chat-wrapper');if(!bar||!wrapper)return;if(!pendingReply){bar.innerHTML='';wrapper.classList.remove('replying');return;}var text=String(pendingReply.text||'رسالة').replace(/\s+/g,' ').trim();if(text.length>120)text=text.slice(0,117)+'...';bar.innerHTML='<button type="button" class="reply-preview-close" onclick="clearReplyTarget()">×</button><div class="reply-preview-title">رد على '+escHtml(pendingReply.name||'Unknown')+'</div><div class="reply-preview-text">'+escHtml(text)+'</div>';wrapper.classList.add('replying');}
function clearReplyTarget(){pendingReply=null;renderReplyPreview();}
function scrollToReplyTarget(id){var el=document.getElementById('msg-'+id);if(!el){showToast('الرسالة الأصلية غير ظاهرة','error');return;}try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){el.scrollIntoView();}el.classList.add('reply-highlight');setTimeout(function(){el.classList.remove('reply-highlight');},1500);}

/* ══════════════════════════════════════════
   SELECTION
══════════════════════════════════════════ */
function toggleSelectMessage(id){closeMessageMenuOnce();var el=document.getElementById('msg-'+id);if(!el)return;if(selectedMessages[id]){delete selectedMessages[id];el.classList.remove('selected-message');}else{selectedMessages[id]=true;el.classList.add('selected-message');}renderSelectionToolbar();}

  }).filter(function(x){return x.url;});
}

function searchBuiltinGifs(q){var nq=normalizeGifQuery(q);if(!nq)return BUILTIN_GIFS;var tokens=nq.split(' ').filter(Boolean);var scored=BUILTIN_GIFS.map(function(g){var hay=normalizeGifQuery((g.title||'')+' '+(g.keywords||''));var score=0;tokens.forEach(function(t){if(hay.indexOf(t)!==-1)score+=2;});if(hay.indexOf(nq)!==-1)score+=5;return{g:g,score:score};}).filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;}).map(function(x){return x.g;});return scored.length?scored:BUILTIN_GIFS.slice(0,12);}

var lb={scale:1,x:0,y:0,dragging:false,lastX:0,lastY:0,pinchStartDist:0,pinchStartScale:1};
function clamp(n,min,max){return Math.min(Math.max(n,min),max);}
function updateLightboxTransform(){var img=document.getElementById('lightboxImg'),level=document.getElementById('lightboxZoomLevel');if(!img)return;lb.scale=clamp(lb.scale,1,5);if(lb.scale<=1.001){lb.scale=1;lb.x=0;lb.y=0;}img.style.transform='translate3d('+lb.x+'px,'+lb.y+'px,0) scale('+lb.scale+')';if(level)level.textContent=Math.round(lb.scale*100)+'%';}
function resetLightboxZoom(){lb.scale=1;lb.x=0;lb.y=0;updateLightboxTransform();}
function zoomLightbox(delta,cx,cy){var old=lb.scale,next=clamp(old+delta,1,5);if(next===old)return;if(cx!=null&&cy!=null){var vw=window.innerWidth/2,vh=window.innerHeight/2;lb.x-=(cx-vw)*(next-old)/Math.max(next,1);lb.y-=(cy-vh)*(next-old)/Math.max(next,1);}lb.scale=next;updateLightboxTransform();}
function closeLightbox(){var el=document.getElementById('lightbox'),img=document.getElementById('lightboxImg');if(el)el.classList.remove('open');if(img)img.src='';resetLightboxZoom();}
function openLightbox(url){resetLightboxZoom();document.getElementById('lightboxImg').src=url;document.getElementById('lightbox').classList.add('open');}
document.getElementById('lightboxClose').addEventListener('click',closeLightbox);
document.getElementById('lightboxZoomIn').addEventListener('click',function(){zoomLightbox(.35);});
document.getElementById('lightboxZoomOut').addEventListener('click',function(){zoomLightbox(-.35);});
document.getElementById('lightboxZoomReset').addEventListener('click',resetLightboxZoom);
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
document.getElementById('lightboxViewport').addEventListener('wheel',function(e){e.preventDefault();zoomLightbox(e.deltaY<0?.25:-.25,e.clientX,e.clientY);},{passive:false});
document.getElementById('lightboxViewport').addEventListener('mousedown',function(e){if(lb.scale<=1)return;lb.dragging=true;lb.lastX=e.clientX;lb.lastY=e.clientY;this.classList.add('dragging');});
window.addEventListener('mousemove',function(e){if(!lb.dragging)return;lb.x+=e.clientX-lb.lastX;lb.y+=e.clientY-lb.lastY;lb.lastX=e.clientX;lb.lastY=e.clientY;updateLightboxTransform();});
window.addEventListener('mouseup',function(){lb.dragging=false;var vp=document.getElementById('lightboxViewport');if(vp)vp.classList.remove('dragging');});
document.getElementById('lightboxViewport').addEventListener('touchstart',function(e){if(e.touches.length===1){lb.dragging=lb.scale>1;lb.lastX=e.touches[0].clientX;lb.lastY=e.touches[0].clientY;}else if(e.touches.length===2){lb.dragging=false;lb.pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);lb.pinchStartScale=lb.scale;}},{passive:false});
document.getElementById('lightboxViewport').addEventListener('touchmove',function(e){if(e.touches.length===2){e.preventDefault();var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lb.pinchStartDist>0){lb.scale=clamp(lb.pinchStartScale*(dist/lb.pinchStartDist),1,5);updateLightboxTransform();}}else if(e.touches.length===1&&lb.dragging){e.preventDefault();var t=e.touches[0];lb.x+=t.clientX-lb.lastX;lb.y+=t.clientY-lb.lastY;lb.lastX=t.clientX;lb.lastY=t.clientY;updateLightboxTransform();}},{passive:false});
document.getElementById('lightboxViewport').addEventListener('touchend',function(){lb.dragging=false;lb.pinchStartDist=0;});
window.addEventListener('keydown',function(e){var el=document.getElementById('lightbox');if(!el||!el.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();else if(e.key==='+'||e.key==='=')zoomLightbox(.35);else if(e.key==='-'||e.key==='_')zoomLightbox(-.35);else if(e.key==='0')resetLightboxZoom();});

/* إنشاء لوحة الأخبار */
async function initializeDynamicNewsBoard(){

  renderLoadingNewsCards();

  try{

    var allNews = [];

    for(var i = 0; i < NEWS_SOURCES.length; i++){

      try{

        var source = NEWS_SOURCES[i];

        var rssProxy =
          'https://api.rss2json.com/v1/api.json?rss_url=' +
          encodeURIComponent(source.rss);

        var response = await fetch(rssProxy);

        var data = await response.json();

        if(data.items){

          data.items.forEach(function(item) {

            allNews.push({
              source : source.name,
              title  : item.title,
              link   : item.link,
              image  :
                item.thumbnail ||
                extractImageFromDescription(item.description) ||
                '',
              date   : item.pubDate,
              description :
                stripHtmlFromNews(item.description || '')
            });

          });

        }

      }catch(sourceError){
        console.error(
          'Failed source:',
          source.name,
          sourceError
        );
      }

    }

    /* فلترة الأخبار التقنية المهمة */
    trendingNews = filterTrendingTechNews(allNews);

    /* ترتيب حسب الأحدث */
    trendingNews.sort(function(a,b){
      return new Date(b.date)-new Date(a.date);
    });

    /* كل كرت يحمل خبر مختلف */
    trendingNews = removeDuplicateNews(trendingNews);

    renderNewsCardsToDOM(trendingNews);

  }catch(error){

    console.error(error);

    renderNewsCards(publicTrendCards());

  }

}

/* عرض كروت التحميل */
function renderLoadingNewsCards(){
  var cm=document.getElementById('chatMessages');if(!cm)return;

/* فلترة الأخبار الترند */
function filterTrendingTechNews(news){

  var keywords = [
    'AI',
    'OpenAI',
    'Google',
    'Microsoft',
    'Apple',
    'NVIDIA',
    'سامسونج',
    'ذكاء اصطناعي',
    'ChatGPT',
    'GPU',
    'Windows',
    'Android',
    'iPhone',
    'RTX'
  ];

  return news.filter(function(item) {

    var text =
      (item.title + ' ' + item.description)
      .toLowerCase();

    return keywords.some(function(keyword){
      return text.indexOf(keyword.toLowerCase()) !== -1;
    });

  });

}

/* إزالة التكرارات */
function removeDuplicateNews(news){

  var seen = [];

  return news.filter(function(item) {

    var normalized =
      item.title.toLowerCase().trim();

    if(seen.indexOf(normalized) !== -1)
      return false;

    seen.push(normalized);

    return true;

  });

}

/* أدوات مساعدة للأخبار */
function stripHtmlFromNews(html){
  var div = document.createElement('div');
  div.innerHTML = html;
  return div.textContent || '';
}

function extractImageFromDescription(html){
  var match =
    String(html||'').match(/<img.*?src="(.*?)"/i);
  return match ? match[1] : '';
}

function formatRelativeTime(date){
  var d = new Date(date);

}

/* فتح نافذة الخبر */
async function openNewsPreview(ndataEncoded){

    +'<div class="news-preview-handle"></div>'
    +'<div class="news-preview-img-wrap">'+imgHtml+'</div>'
    +'<div class="news-preview-body">'
    +'<span class="news-preview-tag">'+escHtml(data.tag||'تقنية')+'</span>'
    +'<div class="news-preview-title">'+escHtml(data.title||'')+'</div>'
    +'<div class="news-preview-meta"><span>'+escHtml(data.source||'مصدر تقني')+'</span><span class="news-preview-meta-dot"></span><span>'+formatRelativeTime(data.date||'')+'</span></div>'
    +'<div class="news-preview-ai-box">'
    +'<div class="news-preview-ai-header"><span class="ai-sparkle">✦</span><span class="news-preview-ai-label">التحليل الذكي للخبر</span></div>'
    +'<div id="newsPreviewSummary" class="news-preview-loading">'
    +'<span class="news-preview-loading-dots"><span class="news-preview-loading-dot"></span><span class="news-preview-loading-dot"></span><span class="news-preview-loading-dot"></span></span>'
    +' جاري تحليل الخبر بالذكاء الاصطناعي...'
    +'</div>'
    +'</div>'
    +'</div>'
    +'<div class="news-preview-actions">'
    +'<button class="news-preview-open" onclick="window.open(\''+escHtml(data.url||'#')+'\',\'_blank\')">🌐 فتح المصدر الأصلي</button>'
    +'<button class="news-preview-close-btn" onclick="closeNewsPreview()">إغلاق</button>'
    +'</div>';

  ov.classList.add('show');
  summarizeNewsWithAI(data);
}

function closeNewsPreview(){var ov=document.getElementById('newsPreviewOverlay');if(ov)ov.classList.remove('show');}

/* تلخيص AI */
function summarizeNewsWithAI(data){
  var summaryEl=document.getElementById('newsPreviewSummary');if(!summaryEl)return;

  var descContent=stripHtmlFromNews(data.desc||'').trim();
  var hasContent=descContent.length>80;

  var prompt=hasContent
    ? 'أنت محرر صحفي عربي متخصص في التكنولوجيا. لخّص هذا الخبر التقني في 3 جمل مفيدة وواضحة باللغة العربية للمستخدم العادي. لا تستخدم أي تنسيق markdown.\n\nالعنوان: '+String(data.title||'')+'\nالمحتوى: '+descContent+'\nالمصدر: '+String(data.source||'')
    : 'أنت محرر صحفي عربي متخصص في التكنولوجيا. زر رابط هذا الخبر واقرأه كاملاً، ثم لخّصه في 3 جمل مفيدة وواضحة باللغة العربية للمستخدم العادي. لا تستخدم أي تنسيق markdown.\n\nالعنوان: '+String(data.title||'')+'\nالرابط: '+String(data.url||'')+'\nالمصدر: '+String(data.source||'');

  var body={model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]};
  if(!hasContent)body.tools=[{type:'web_search_20250305',name:'web_search'}];

  fetch(AI_ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':'YOUR_ANTHROPIC_API_KEY','anthropic-version':'2023-06-01'},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();})
  .then(function(j){
    var text=(j.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('').trim();
    var el=document.getElementById('newsPreviewSummary');
    if(el){
      el.className='news-preview-summary news-preview-summary-border';
      el.textContent=text||data.desc||'افتح المصدر لقراءة التفاصيل الكاملة.';
    }
  }).catch(function(){
    var el=document.getElementById('newsPreviewSummary');
    if(el){
      el.className='news-preview-summary news-preview-summary-border';
      el.textContent=data.desc||'افتح المصدر لقراءة التفاصيل الكاملة.';
    }
  });
}

/* رسم الكروت الاحتياطية */
function renderNewsCards(cards){
  var cm=document.getElementById('chatMessages');if(!cm)return;
  var nowStr=new Date().toLocaleDateString('ar-IQ',{month:'long',day:'numeric'});
  var html='<div class="public-news-board">'
    +'<div class="news-board-header">'
    +'<span class="news-board-title"><span class="news-board-title-icon">📡</span> أحدث الترندات التقنية</span>'
    +'<span class="news-board-subtitle"><span class="news-live-dot"></span>مباشر · '+escHtml(nowStr)+'</span>'
    +'</div>'
    +'<div class="news-cards-grid">';

  (cards||[]).slice(0,12).forEach(function(n){
    var img=n.img||fallbackTechImage(n);
    var ndata=encodeURIComponent(JSON.stringify({
      title:cleanTitle(n.title||''),
      desc:n.desc||'',
      url:n.url||'#',
      img:img,
      tag:n.tag||'تقنية',
      source:n.source||'',
      emoji:n.emoji||'📰'
    }));
    var tc=tagClass(n.tag||'');
    html+='<div class="news-card" onclick="openNewsPreview(\''+ndata+'\')" role="button" tabindex="0">';
    html+='<div class="news-thumb-wrap">';
    html+='<img class="news-thumb" src="'+escHtml(img)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+fallbackTechImage(n)+'\'"/>';
    html+='<div class="news-thumb-gradient"></div>';
    html+='<span class="news-source-badge-img">'+escHtml(n.source||'مصدر')+'</span>';
    html+='</div>';
    html+='<div class="news-card-body">';
    html+='<div class="news-card-top"><span class="news-tag '+tc+'">'+escHtml(n.tag||'تقنية')+'</span></div>';
    html+='<div class="news-title">'+escHtml(cleanTitle(n.title||'خبر تقني مهم'))+'</div>';
    if(n.desc)html+='<div class="news-desc">'+escHtml(n.desc)+'</div>';
    html+='<div class="news-card-footer"><span class="news-source-dot"></span><span class="news-source-name">'+escHtml(n.source||'مصدر موثوق')+'</span><span class="news-read-chip">اقرأ ›</span></div>';
    html+='</div></div>';
  });

  html+='</div></div>';
  cm.innerHTML=html;
}
